                    projectiles.push({ x: fromLeft ? -14 : w + 14, y: gapY + gapH, w: 12, h: h - (gapY + gapH), vx: (fromLeft ? 1 : -1) * 2.4 * spd, vy: 0, type: 'WHITE', typingPrompt: promptChar, isMatched: false, pairId: pairId, showPromptLabel: false });
                }
            } else if (subName === 'P2_AIM_BLASTERS') {
                const interval = isFast ? 86 : 106;
                const charge = isFast ? 82 : 100;
                if (f % interval === 10) {
                    const step = Math.floor(f / interval);
                    audio.playBlasterCharge();
                    spawnAimedBlaster(w, h, step, charge);
                }
            } else if (subName === 'P3_BONE_WAVE') {
                const interval = isFast ? 14 : 17;
                if (f === 0 || f % interval === 0) {
                    const idx = Math.floor(f / interval);
                    const wave = Math.sin(idx * 0.42);
                    const gapH = isFast ? 64 : 74;
                    const bottomH = Math.floor((h * 0.36) + wave * (h * 0.24));
                    const topH = Math.max(12, h - bottomH - gapH);
                    const useWordMode = (gameState.turn + 1) >= 3;
                    const groupSize = useWordMode ? 12 : 6;
                    const groupIndex = Math.floor(idx / groupSize);
                    if (typingState.waveLastGroupIndex !== groupIndex || !typingState.waveGroupPrompt) {
                        typingState.waveLastGroupIndex = groupIndex;
                        typingState.waveGroupPrompt = useWordMode ? getNextWordPrompt() : getNextAlphabetPrompt();
                        typingState.waveGroupPairId = typingState.pairSeq++;
                    }
                    const promptText = typingState.waveGroupPrompt;
                    const pairId = typingState.waveGroupPairId;
                    projectiles.push({ x: w + 10, y: h - bottomH, w: 12, h: bottomH, vx: -3.2 * spd, vy: 0, type: 'WHITE', typingPrompt: promptText, isMatched: false, pairId: pairId, showPromptLabel: true, isWaveLeader: true, labelY: topH + gapH / 2, isWordPrompt: useWordMode });
                    projectiles.push({ x: w + 10, y: 0, w: 12, h: topH, vx: -3.2 * spd, vy: 0, type: 'WHITE', typingPrompt: promptText, isMatched: false, pairId: pairId, showPromptLabel: false, isWordPrompt: useWordMode });
                }
            } else if (subName === 'CORRIDOR_CROSS') {
                const interval = isFast ? 19 : 23;
                if (f === 0 || f % interval === 0) {
                    const idx = Math.floor(f / interval);
                    const crossWave = Math.sin(idx * 0.72);
                    const gapH = isFast ? 60 : 68;
                    const bottomH = Math.floor((h * 0.36) + crossWave * (h * 0.28));
                    const topH = Math.max(12, h - bottomH - gapH);
                    const groupIndex = Math.floor(idx / 4);
                    if (typingState.waveLastGroupIndex !== groupIndex || !typingState.waveGroupPrompt) {
                        typingState.waveLastGroupIndex = groupIndex;
                        typingState.waveGroupPrompt = getNextWordPrompt();
                        typingState.waveGroupPairId = typingState.pairSeq++;
                    }
                    const promptText = typingState.waveGroupPrompt;
                    const pairId = typingState.waveGroupPairId;
                    projectiles.push({ x: w + 10, y: h - bottomH, w: 12, h: bottomH, vx: -3.1 * spd, vy: 0, type: 'WHITE', typingPrompt: promptText, isMatched: false, pairId: pairId, showPromptLabel: true, isWaveLeader: true, labelY: topH + gapH / 2, isWordPrompt: true });
                    projectiles.push({ x: w + 10, y: 0, w: 12, h: topH, vx: -3.1 * spd, vy: 0, type: 'WHITE', typingPrompt: promptText, isMatched: false, pairId: pairId, showPromptLabel: false, isWordPrompt: true });
                }
            } else if (subName === 'P4_MERGE_1_AND_2') {
                const boneInterval = isFast ? 56 : 68;
                if (f % boneInterval === 0) {
                    const step = Math.floor(f / boneInterval);
                    const fromLeft = step % 2 === 0;
                    const gapH = isFast ? 66 : 76;
                    const gapY = 26 + ((step * 53) % Math.max(20, h - gapH - 52));
                    const promptChar = getNextAlphabetPrompt();
                    const pairId = typingState.pairSeq++;
                    projectiles.push({ x: fromLeft ? -14 : w + 14, y: 0, w: 12, h: gapY, vx: (fromLeft ? 1 : -1) * 2.25 * spd, vy: 0, type: 'WHITE', typingPrompt: promptChar, isMatched: false, pairId: pairId, showPromptLabel: true, labelY: gapY + gapH / 2 });
                    projectiles.push({ x: fromLeft ? -14 : w + 14, y: gapY + gapH, w: 12, h: h - (gapY + gapH), vx: (fromLeft ? 1 : -1) * 2.25 * spd, vy: 0, type: 'WHITE', typingPrompt: promptChar, isMatched: false, pairId: pairId, showPromptLabel: false });
                }
                const blasterInterval = isFast ? 104 : 126;
                const charge = isFast ? 86 : 104;
                if (f % blasterInterval === 22) {
                    const step = Math.floor(f / blasterInterval);
                    audio.playBlasterCharge();
                    spawnAimedBlaster(w, h, step + 1, charge);
                }
            } else if (subName === 'WALL_SLAM_8_SEQ') {
                const dirs = ['LEFT', 'RIGHT', 'DOWN', 'UP', 'LEFT', 'DOWN', 'UP', 'RIGHT'];
                const interval = 210;
                if (f % interval === 5) {
                    const idx = Math.floor(f / interval);
                    if (idx < dirs.length) {
                        triggerWallSlam(dirs[idx]);
                    }
                }
            } else if (subName === 'SAWTOOTH_6_RUSH') {
                const interval = 52;
                if (f % interval === 5) {
                    const idx = Math.floor(f / interval);
                    if (idx < 6) {
                        spawnSawtoothBoneGear(w, h, idx, spd);
                    }
                }
            } else if (subName === 'GIANT_BONE_SLAM_3') {
                const interval = 95;
                if (f % interval === 10) {
                    const idx = Math.floor(f / interval);
                    if (idx < 3) {
                        spawnGiantBoneSlam(w, h, idx);
                    }
                }
            } else if (subName === 'SMALL_BLASTERS_HALF_MEGA') {
                if (f % 45 === 10) {
                    const idx = Math.floor(f / 45);
                    audio.playBlasterCharge();
                    spawnAimedBlaster(w, h, idx, 54);
                }
            }
        }

        function spawnFixedPatternEntities(pattern, w, h, diff) {
            const name = pattern.name;
            const f = turnFrame;

            if (
                name === 'P1_SIMPLE_BONES' ||
                name === 'P2_AIM_BLASTERS' ||
                name === 'P3_BONE_WAVE' ||
                name === 'P4_MERGE_1_AND_2'
            ) {
                runSubPattern(name, f, w, h, diff);
            } else if (name === 'P5_SEQ_1_2_3') {
                if (f < 250) {
                    runSubPattern('P1_SIMPLE_BONES', f, w, h, diff);
                } else if (f >= 280 && f < 540) {
                    runSubPattern('P2_AIM_BLASTERS', f - 280, w, h, diff);
                } else if (f >= 570) {
                    runSubPattern('P3_BONE_WAVE', f - 570, w, h, diff);
                }
            } else if (name === 'P6_CIRCLE_WAVE_CIRCLE') {
                if (f === 10) {
                    audio.playBlasterCharge();
                    spawnCircleBlastersCluster(w, h);
                } else if (f >= 565 && f < 940) {
                    runSubPattern('P3_BONE_WAVE', f - 565, w, h, diff);
                } else if (f === 995) {
                    audio.playBlasterCharge();
                    spawnCircleBlastersCluster(w, h);
                }
                maxTurnFrames = 1565;
            } else if (name === 'P7_TRIPLE_MEGA_P4') {
                if (f === 15) {
                    audio.playBlasterCharge();
                    spawnSideTripleBlasters(w, h);
                } else if (f === 360) {
                    audio.playBlasterCharge();
                    spawnMegaFullScreenBlaster(w, h);
                } else if (f >= 880) {
                    runSubPattern('P4_MERGE_1_AND_2', f - 880, w, h, diff);
                }
            } else if (name === 'P8_SEQ_6_AND_7') {
                maxTurnFrames = 3025;
                if (f < 1565) {
                    if (f === 10) {
                        audio.playBlasterCharge();
                        spawnCircleBlastersCluster(w, h);
                    } else if (f >= 565 && f < 940) {
                        runSubPattern('P3_BONE_WAVE', f - 565, w, h, diff);
                    } else if (f === 995) {
                        audio.playBlasterCharge();
                        spawnCircleBlastersCluster(w, h);
                    }
                } else {
                    const f7 = f - 1565;
                    if (f7 === 15) {
                        audio.playBlasterCharge();
                        spawnSideTripleBlasters(w, h);
                    } else if (f7 === 360) {
                        audio.playBlasterCharge();
                        spawnMegaFullScreenBlaster(w, h);
                    } else if (f7 >= 880) {
                        runSubPattern('P4_MERGE_1_AND_2', f7 - 880, w, h, diff);
                    }
                }
            } else if (name === 'P9_WALL_SLAM_CIRCLE') {
                maxTurnFrames = 2320;
                if (f < 1720) {
                    runSubPattern('WALL_SLAM_8_SEQ', f, w, h, diff);
                } else if (f === 1740) {
                    audio.playBlasterCharge();
                    spawnCircleBlastersCluster(w, h);
                }
            } else if (name === 'P10_TRIPLE_P1_SAWTOOTH') {
                if (f === 15) {
                    audio.playBlasterCharge();
                    spawnSideTripleBlasters(w, h);
                }
                if (f < 420) {
                    runSubPattern('P1_SIMPLE_BONES', f, w, h, diff);
                } else if (f >= 460) {
                    runSubPattern('SAWTOOTH_6_RUSH', f - 460, w, h, diff);
                }
            } else if (name === 'P11_SAW_P2_AND_P5') {
                if (f < 400) {
                    runSubPattern('SAWTOOTH_6_RUSH', f, w, h, diff);
                    runSubPattern('P2_AIM_BLASTERS', f, w, h, diff);
                } else {
                    const f5 = f - 420;
                    if (f5 >= 0 && f5 < 250) {
                        runSubPattern('P1_SIMPLE_BONES', f5, w, h, diff);
                    } else if (f5 >= 280 && f5 < 540) {
                        runSubPattern('P2_AIM_BLASTERS', f5 - 280, w, h, diff);
                    } else if (f5 >= 570) {
                        runSubPattern('P3_BONE_WAVE', f5 - 570, w, h, diff);
                    }
                }
            } else if (name === 'P12_GRAND_FINALE') {
                maxTurnFrames = 3140;
                if (f < 1720) {
                    runSubPattern('WALL_SLAM_8_SEQ', f, w, h, diff);
                } else if (f >= 1750 && f < 2080) {
                    runSubPattern('SAWTOOTH_6_RUSH', f - 1750, w, h, diff);
                } else if (f >= 2120 && f < 2480) {
                    runSubPattern('GIANT_BONE_SLAM_3', f - 2120, w, h, diff);
                } else if (f === 2540) {
                    audio.playBlasterCharge();
                    spawnMegaFullScreenBlaster(w, h);
                }
            } else if (name === 'P13_BOMB_SAW_CORRIDOR') {
                if (f === 15 || f === 85 || f === 155) {
                    spawnBlasterBomb(w, h, Math.floor(f / 70));
                } else if (f >= 260 && f < 620) {
                    runSubPattern('SAWTOOTH_6_RUSH', f - 260, w, h, diff);
                } else if (f >= 660) {
                    runSubPattern('CORRIDOR_CROSS', f - 660, w, h, diff);
                }
            } else if (name === 'P14_BOMB_CIRCLE_MEGA') {
                maxTurnFrames = 3580;
                if (f === 15) {
                    spawnBlasterBomb(w, h, 0);
                    audio.playBlasterCharge();
                    spawnCircleBlastersCluster(w, h);
                } else if (f === 575) {
                    spawnBlasterBomb(w, h, 1);
                    audio.playBlasterCharge();
                    spawnCircleBlastersCluster(w, h);
                } else if (f >= 1135 && f < 2855) {
                    runSubPattern('WALL_SLAM_8_SEQ', f - 1135, w, h, diff);
                    if ((f - 1135) % 260 < 240) {
                        runSubPattern('SAWTOOTH_6_RUSH', (f - 1135) % 260, w, h, diff);
                    }
                } else if (f >= 2895) {
                    if (f === 2895) {
                        audio.playBlasterCharge();
                        spawnMegaFullScreenBlaster(w, h);
                    }
                    runSubPattern('SMALL_BLASTERS_HALF_MEGA', f - 2895, w, h, diff);
                }
            } else if (name === 'P15_APOCALYPSE_FINALE') {
                maxTurnFrames = 3350;
                if (f === 20) {
                    spawnSurroundingSawRingAndBlasters(w, h);
                } else if (f >= 600 && f < 1060) {
                    runSubPattern('P3_BONE_WAVE', f - 600, w, h, diff);
                } else if (f >= 1100 && f < 1380) {
                    runSubPattern('SAWTOOTH_6_RUSH', f - 1100, w, h, diff);
                } else if (f >= 1420 && f < 1840) {
                    const bf = f - 1420;
                    if (bf % 14 === 0) {
                        const bIdx = Math.floor(bf / 14);
                        if (bIdx < 30) {
                            audio.playBlasterCharge();
                            spawnAimedBlaster(w, h, bIdx, 62);
                        }
                    }
                } else if (f >= 1900 && f < 2180) {
                    runSubPattern('SAWTOOTH_6_RUSH', f - 1900, w, h, diff);
                } else if (f === 2240) {
                    spawnSurroundingSawRingAndBlasters(w, h);
                }
            } else if (name === 'HIDDEN_CROSS_10') {
                const cx = w / 2;
                const cy = h / 2;
                const armHalf = Math.min(w, h) * 0.16;

                // 1. 위쪽 통로: 블래스터 폭탄 생성 (약 1.75초 간격)
                if (f % 105 === 10 && f <= 520) {
                    const bIdx = Math.floor(f / 105);
                    const bx = cx + ((bIdx % 3) - 1) * (armHalf * 0.45);
                    const by = cy - armHalf * 1.45;
                    const wordPrompt = getNextWordPrompt();
                    bombs.push({
                        x: bx,
                        y: 12,
                        targetY: by,
                        vy: 3.4,
                        fuse: 150,
                        spin: 0,
                        typingPrompt: wordPrompt,
                        isMatched: (typingState.currentInput.trim().toUpperCase() === wordPrompt.toUpperCase()),
                        isWordPrompt: true
                    });
                }

                // 2. 오른쪽 통로: 회전 톱니 뼈 기어 돌진 (약 0.9초 간격)
                if (f % 54 === 8 && f <= 540) {
                    const sIdx = Math.floor(f / 54);
                    const radius = 22;
                    const offsetY = (sIdx % 2 === 0 ? -1 : 1) * (armHalf * 0.42);
                    const promptChar = getNextAlphabetPrompt();
                    projectiles.push({
                        x: w - 18,
                        y: cy + offsetY,
                        vx: -3.8,
                        vy: 0,
                        radius: radius,
                        angle: 0,
                        rotSpeed: sIdx % 2 === 0 ? 0.16 : -0.16,
                        isSawtoothGear: true,
                        typingPrompt: promptChar,
                        isMatched: (typingState.currentInput.trim().toUpperCase() === promptChar.toUpperCase())
                    });
                }

                // 3. 왼쪽 통로: 위아래 엇갈리는 뼈 복도 생성
                if (f % 26 === 4 && f <= 550) {
                    const cIdx = Math.floor(f / 26);
                    const isTopBone = cIdx % 2 === 0;
                    const boneLen = armHalf * 1.15;
                    const promptChar = getNextAlphabetPrompt();
                    projectiles.push({
                        x: 10,
                        y: isTopBone ? (cy - armHalf + 4) : (cy + armHalf - boneLen - 4),
                        w: 11,
                        h: boneLen,
                        vx: 3.5,
                        vy: 0,
                        type: 'WHITE',
                        typingPrompt: promptChar,
                        isMatched: (typingState.currentInput.trim().toUpperCase() === promptChar.toUpperCase()),
                        showPromptLabel: true
                    });
                }

                // 4. 아래쪽 통로: 파도치는 뼈 웨이브 상승
                if (f % 16 === 0 && f <= 560) {
                    const wIdx = Math.floor(f / 16);
                    const wave = Math.sin(wIdx * 0.55);
                    const gapW = 46;
                    const leftW = Math.max(12, Math.floor(armHalf + wave * (armHalf * 0.48) - gapW / 2));
                    const rightW = Math.max(12, Math.floor(armHalf * 2 - leftW - gapW));
                    const groupIdx = Math.floor(wIdx / 5);
                    if (typingState.waveLastGroupIndex !== groupIdx || !typingState.waveGroupPrompt) {
                        typingState.waveLastGroupIndex = groupIdx;
                        typingState.waveGroupPrompt = getNextWordPrompt();
                        typingState.waveGroupPairId = typingState.pairSeq++;
                    }
                    const promptText = typingState.waveGroupPrompt;
                    const pairId = typingState.waveGroupPairId;

                    projectiles.push({
                        x: cx - armHalf,
                        y: h - 14,
                        w: leftW,
                        h: 11,
                        vx: 0,
                        vy: -3.6,
                        type: 'WHITE',
                        typingPrompt: promptText,
                        isMatched: (typingState.currentInput.trim().toUpperCase() === promptText.toUpperCase()),
                        pairId: pairId,
                        showPromptLabel: true,
                        isWaveLeader: true,
                        labelY: h - 22,
                        isWordPrompt: true
                    });
                    projectiles.push({
                        x: cx + armHalf - rightW,
                        y: h - 14,
                        w: rightW,
                        h: 11,
                        vx: 0,
                        vy: -3.6,
                        type: 'WHITE',
                        typingPrompt: promptText,
                        isMatched: (typingState.currentInput.trim().toUpperCase() === promptText.toUpperCase()),
                        pairId: pairId,
                        showPromptLabel: false,
                        isWordPrompt: true
                    });
                }
            }
        }

        function drawCrossArena(ctx, w, h) {
            const cx = w / 2;
            const cy = h / 2;
            const armHalf = Math.min(w, h) * 0.16;
            const pad = 6;

            ctx.save();
            ctx.fillStyle = '#000000';
            ctx.fillRect(cx - armHalf, pad, armHalf * 2, h - pad * 2);
            ctx.fillRect(pad, cy - armHalf, w - pad * 2, armHalf * 2);

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx - armHalf, pad);
            ctx.lineTo(cx + armHalf, pad);
            ctx.lineTo(cx + armHalf, cy - armHalf);
            ctx.lineTo(w - pad, cy - armHalf);
            ctx.lineTo(w - pad, cy + armHalf);
            ctx.lineTo(cx + armHalf, cy + armHalf);
            ctx.lineTo(cx + armHalf, h - pad);
            ctx.lineTo(cx - armHalf, h - pad);
            ctx.lineTo(cx - armHalf, cy + armHalf);
            ctx.lineTo(pad, cy + armHalf);
            ctx.lineTo(pad, cy - armHalf);
            ctx.lineTo(cx - armHalf, cy - armHalf);
            ctx.closePath();
            ctx.stroke();

            ctx.font = 'bold 10px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
            ctx.fillText('BOMB', cx, pad + 14);
            ctx.fillText('WAVE', cx, h - pad - 8);
            ctx.fillText('CORRIDOR', pad + 42, cy - armHalf + 14);
            ctx.fillText('SAW', w - pad - 24, cy - armHalf + 14);
            ctx.restore();
        }

        function battleLoop(now) {
            if (gameState.phase !== 'ENEMY_TURN') return;
            battleAnimId = requestAnimationFrame(battleLoop);

            if (now) {
                const elapsed = now - lastBattleFrameTime;
                if (elapsed < 1000 / 62) return;
                lastBattleFrameTime = now - (elapsed % (1000 / 60));
            }

            const canvas = document.getElementById('battle-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const diff = DIFFICULTY_CONFIG[gameState.difficulty];
            const pattern = getCurrentPattern();

            turnFrame++;
            if (turnFrame >= maxTurnFrames) {
                endEnemyTurn();
                return;
            }

            if (screenShake.timer > 0) {
                screenShake.timer--;
                screenShake.x = (Math.random() - 0.5) * 10;
                screenShake.y = (Math.random() - 0.5) * 10;
            } else {
                screenShake.x = 0;
                screenShake.y = 0;
            }

            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);
            ctx.fillStyle = '#000000';
            ctx.fillRect(-20, -20, w + 40, h + 40);

            if (pattern.isCrossArena) {
                drawCrossArena(ctx, w, h);
            }

            spawnFixedPatternEntities(pattern, w, h, diff);

            if (slamState.active) {
                slamState.timer++;
                if (slamState.phase === 'SLAM') {
                    const slamSpeed = 16;
                    if (slamState.dir === 'LEFT') player.x -= slamSpeed;
                    else if (slamState.dir === 'RIGHT') player.x += slamSpeed;
                    else if (slamState.dir === 'DOWN') player.y += slamSpeed;
                    else if (slamState.dir === 'UP') player.y -= slamSpeed;

                    let hitWall = false;
                    if (slamState.dir === 'LEFT' && player.x <= 8) { player.x = 8; hitWall = true; }
                    if (slamState.dir === 'RIGHT' && player.x >= w - player.size - 8) { player.x = w - player.size - 8; hitWall = true; }
                    if (slamState.dir === 'DOWN' && player.y >= h - player.size - 8) { player.y = h - player.size - 8; hitWall = true; }
                    if (slamState.dir === 'UP' && player.y <= 8) { player.y = 8; hitWall = true; }

                    if (hitWall) {
                        damagePlayer(1);
                        slamState.phase = 'PRE_SPIKE_WARN';
                        slamState.timer = 0;
                        screenShake.timer = 14;
                        audio.playTone(95, 'sawtooth', 0.2, 0.09);
                    }
                } else if (slamState.phase === 'PRE_SPIKE_WARN') {
                    const spikeLenW = Math.floor(w * 0.24);
                    const spikeLenH = Math.floor(h * 0.32);
                    let wx = 0, wy = 0, ww = w, wh = h;
                    if (slamState.dir === 'LEFT') {
                        wx = 0; wy = 0; ww = spikeLenW; wh = h;
                    } else if (slamState.dir === 'RIGHT') {
                        wx = w - spikeLenW; wy = 0; ww = spikeLenW; wh = h;
                    } else if (slamState.dir === 'DOWN') {
                        wx = 0; wy = h - spikeLenH; ww = w; wh = spikeLenH;
                    } else if (slamState.dir === 'UP') {
                        wx = 0; wy = 0; ww = w; wh = spikeLenH;
                    }

                    ctx.save();
                    ctx.fillStyle = 'rgba(236, 72, 153, 0.16)';
                    ctx.strokeStyle = '#ff66cc';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.fillRect(wx, wy, ww, wh);
                    ctx.strokeRect(wx, wy, ww, wh);
                    ctx.setLineDash([]);

                    if (slamState.typingPrompt) {
                        ctx.font = 'bold 18px "Press Start 2P", monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.lineWidth = 5;
                        ctx.strokeStyle = '#000000';
                        const tx = wx + ww / 2;
                        const ty = wy + wh / 2;
                        ctx.strokeText(slamState.typingPrompt, tx, ty);
                        ctx.fillStyle = slamState.isMatched ? '#22c55e' : '#ff66cc';
                        ctx.fillText(slamState.typingPrompt, tx, ty);
                    }
                    ctx.restore();

                    if (slamState.timer >= 110) {
                        slamState.typingPrompt = '';
                        if (slamState.negated) {
                            slamState.active = false;
                            player.mode = 'RED';
                            player.x = w / 2 - player.size / 2;
                            player.y = h / 2 - player.size / 2;
                        } else {
                            slamState.phase = 'SPIKES';
                            slamState.timer = 0;
                            audio.playTone(130, 'sawtooth', 0.18, 0.09);

                            const spikeThick = 14;
                            if (slamState.dir === 'LEFT') {
                                for (let sy = 8; sy < h - 16; sy += 26) {
                                    projectiles.push({ x: -spikeLenW, y: sy, w: spikeLenW, h: spikeThick, vx: 9, vy: 0, type: 'WHITE', life: 48, isWallSpike: true, wallDir: 'LEFT', maxLen: spikeLenW });
                                }
                            } else if (slamState.dir === 'RIGHT') {
                                for (let sy = 8; sy < h - 16; sy += 26) {
                                    projectiles.push({ x: w, y: sy, w: spikeLenW, h: spikeThick, vx: -9, vy: 0, type: 'WHITE', life: 48, isWallSpike: true, wallDir: 'RIGHT', maxLen: spikeLenW });
                                }
                            } else if (slamState.dir === 'DOWN') {
                                for (let sx = 10; sx < w - 18; sx += 28) {
                                    projectiles.push({ x: sx, y: h, w: spikeThick, h: spikeLenH, vx: 0, vy: -9, type: 'WHITE', life: 48, isWallSpike: true, wallDir: 'DOWN', maxLen: spikeLenH });
                                }
                            } else if (slamState.dir === 'UP') {
                                for (let sx = 10; sx < w - 18; sx += 28) {
                                    projectiles.push({ x: sx, y: -spikeLenH, w: spikeThick, h: spikeLenH, vx: 0, vy: 9, type: 'WHITE', life: 48, isWallSpike: true, wallDir: 'UP', maxLen: spikeLenH });
                                }
                            }
                        }
                    }
                } else if (slamState.phase === 'SPIKES' && slamState.timer > 50) {
                    slamState.active = false;
                    player.mode = 'RED';
                    player.x = w / 2 - player.size / 2;
                    player.y = h / 2 - player.size / 2;
                }
            }

            for (let i = bombs.length - 1; i >= 0; i--) {
                const bm = bombs[i];
                bm.spin += 0.14;
                if (bm.y < bm.targetY) {
                    bm.y += bm.vy;
                } else {
                    bm.fuse--;
                }

                ctx.save();
                ctx.translate(bm.x, bm.y);
                ctx.rotate(bm.spin);
                ctx.fillStyle = bm.fuse < 35 && bm.fuse % 4 < 2 ? '#ef4444' : '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(-4, -2, 3, 0, Math.PI * 2);
                ctx.arc(4, -2, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(-6, 4, 12, 3);
                ctx.restore();

                if (bm.typingPrompt) {
                    ctx.save();
                    ctx.font = 'bold 16px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = '#000000';
                    const secLeft = Math.max(0.1, bm.fuse / 60).toFixed(1);
                    ctx.strokeText(bm.typingPrompt, bm.x, bm.y - 24);
                    ctx.fillStyle = bm.isMatched ? '#22c55e' : '#ff66cc';
                    ctx.fillText(bm.typingPrompt, bm.x, bm.y - 24);
                    ctx.font = 'bold 11px "Press Start 2P", monospace';
                    ctx.strokeText(`${secLeft}s`, bm.x, bm.y + 24);
                    ctx.fillStyle = bm.fuse < 60 ? '#ef4444' : '#facc15';
                    ctx.fillText(`${secLeft}s`, bm.x, bm.y + 24);
                    ctx.restore();
                }

                if (bm.fuse <= 0) {
                    explodeBlasterBomb(bm.x, bm.y);
                    bombs.splice(i, 1);
                }
            }

            const boxCx = w / 2;
            const boxCy = h / 2;
            for (let i = surroundingSaws.length - 1; i >= 0; i--) {
                const sw = surroundingSaws[i];
                sw.timer++;
                sw.angle += sw.rotSpeed;
                sw.theta += 0.008;

                if (sw.timer < sw.aimFrames - 18) {
                    const t = sw.timer / (sw.aimFrames - 18);
                    sw.currentDist = sw.startDist + (sw.midDist - sw.startDist) * t;
                } else if (sw.timer <= sw.aimFrames) {
                    const snapT = (sw.timer - (sw.aimFrames - 18)) / 18;
                    const easeSnap = 1 - Math.pow(1 - snapT, 3);
                    sw.currentDist = sw.midDist + (sw.finalDist - sw.midDist) * easeSnap;
                } else {
                    sw.currentDist = sw.finalDist;
                }

                const sx = boxCx + Math.cos(sw.theta) * sw.currentDist;
                const sy = boxCy + Math.sin(sw.theta) * sw.currentDist;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(sw.angle);
                ctx.fillStyle = '#ffffff';
                for (let sp = 0; sp < 4; sp++) {
                    ctx.save();
                    ctx.rotate((sp * Math.PI) / 4);
                    ctx.fillRect(-sw.radius, -2.5, sw.radius * 2, 5);
                    ctx.beginPath();
                    ctx.arc(-sw.radius, 0, 3, 0, Math.PI * 2);
                    ctx.arc(sw.radius, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                ctx.beginPath();
                ctx.arc(0, 0, sw.radius * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                const dx = (player.x + player.size / 2) - sx;
                const dy = (player.y + player.size / 2) - sy;
                if (Math.hypot(dx, dy) < sw.radius + 3) {
                    damagePlayer(1);
                }
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.r += (sw.maxR - sw.r) * 0.18;
                sw.life--;
                ctx.strokeStyle = sw.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
                ctx.stroke();
                if (sw.life <= 0) shockwaves.splice(i, 1);
            }

            for (let i = slamWarnings.length - 1; i >= 0; i--) {
                const sw = slamWarnings[i];
                sw.timer--;

                ctx.save();
                ctx.fillStyle = 'rgba(236, 72, 153, 0.18)';
                ctx.strokeStyle = '#ff66cc';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 4]);
                ctx.fillRect(sw.x, sw.y, sw.w, sw.h);
                ctx.strokeRect(sw.x, sw.y, sw.w, sw.h);
                ctx.setLineDash([]);

                if (sw.typingPrompt) {
                    ctx.font = 'bold 17px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = '#000000';
                    const tx = sw.x + sw.w / 2;
                    const ty = sw.y + sw.h / 2;
                    ctx.strokeText(sw.typingPrompt, tx, ty);
                    ctx.fillStyle = sw.isMatched ? '#22c55e' : '#ff66cc';
                    ctx.fillText(sw.typingPrompt, tx, ty);
                }
                ctx.restore();

                if (sw.timer <= 0) {
                    screenShake.timer = 14;
                    audio.playTone(110, 'sawtooth', 0.22, 0.1);
                    projectiles.push({
                        x: sw.x,
                        y: sw.y,
                        w: sw.w,
                        h: sw.h,
                        vx: 0,
                        vy: 0,
                        type: 'WHITE',
                        life: 32,
                        isGiantSlam: true
                    });
                    slamWarnings.splice(i, 1);
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];

                if (p.isWallSpike) {
                    if (p.wallDir === 'LEFT' && p.x < 0) p.x = Math.min(0, p.x + p.vx);
                    else if (p.wallDir === 'RIGHT' && p.x > w - p.maxLen) p.x = Math.max(w - p.maxLen, p.x + p.vx);
                    else if (p.wallDir === 'DOWN' && p.y > h - p.maxLen) p.y = Math.max(h - p.maxLen, p.y + p.vy);
                    else if (p.wallDir === 'UP' && p.y < 0) p.y = Math.min(0, p.y + p.vy);
                } else {
                    p.x += p.vx;
                    p.y += p.vy;
                }

                if (p.life !== undefined) {
                    p.life--;
                    if (p.life <= 0) {
                        projectiles.splice(i, 1);
                        continue;
                    }
                }

                if (p.isSawtoothGear) {
                    p.angle += p.rotSpeed;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;

                    for (let sp = 0; sp < 4; sp++) {
                        ctx.save();
                        ctx.rotate((sp * Math.PI) / 4);
                        ctx.fillRect(-p.radius, -3, p.radius * 2, 6);
                        ctx.beginPath();
                        ctx.arc(-p.radius, -3, 4, 0, Math.PI * 2);
                        ctx.arc(-p.radius, 3, 4, 0, Math.PI * 2);
                        ctx.arc(p.radius, -3, 4, 0, Math.PI * 2);
                        ctx.arc(p.radius, 3, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius * 0.35, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();

                    if (p.typingPrompt) {
                        ctx.save();
                        ctx.font = 'bold 26px "Press Start 2P", monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.lineWidth = 5;
                        ctx.strokeStyle = '#000000';
                        ctx.strokeText(p.typingPrompt, p.x, p.y);
                        ctx.fillStyle = p.isMatched ? '#22c55e' : '#ff66cc';
                        ctx.fillText(p.typingPrompt, p.x, p.y);
                        ctx.restore();
                    }

                    const dx = (player.x + player.size / 2) - p.x;
                    const dy = (player.y + player.size / 2) - p.y;
                    if (Math.hypot(dx, dy) < p.radius + 4) {
                        damagePlayer(1);
                    }

                    if (p.x < -80 || p.x > w + 80) {
                        projectiles.splice(i, 1);
                    }
                    continue;
                }

                if (p.isGiantSlam) {
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    const boneSpacing = 26;
                    const shaftW = 14;
                    const knobR = 6;
                    for (let bx = p.x + 14; bx < p.x + p.w - 10; bx += boneSpacing) {
                        ctx.fillRect(bx - shaftW / 2, p.y + knobR, shaftW, p.h - knobR * 2);
                        ctx.strokeRect(bx - shaftW / 2, p.y + knobR, shaftW, p.h - knobR * 2);
                        ctx.beginPath();
                        ctx.arc(bx - shaftW / 2, p.y + knobR + 2, knobR, 0, Math.PI * 2);
                        ctx.arc(bx + shaftW / 2, p.y + knobR + 2, knobR, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(bx - shaftW / 2, p.y + p.h - knobR - 2, knobR, 0, Math.PI * 2);
                        ctx.arc(bx + shaftW / 2, p.y + p.h - knobR - 2, knobR, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = p.type === 'BLUE' ? '#00ffff' : (p.type === 'ORANGE' ? '#ff9900' : '#ffffff');
                    ctx.fillRect(p.x, p.y, p.w, p.h);

                    if (p.w >= p.h) {
                        ctx.fillRect(p.x - 2, p.y - 2, 4, p.h + 4);
                        ctx.fillRect(p.x + p.w - 2, p.y - 2, 4, p.h + 4);
                    } else {
                        ctx.fillRect(p.x - 2, p.y - 2, p.w + 4, 4);
                        ctx.fillRect(p.x - 2, p.y + p.h - 2, p.w + 4, 4);
                    }
                }

                const hitMargin = 2;
                if (
                    player.x + player.size - hitMargin > p.x &&
                    player.x + hitMargin < p.x + p.w &&
                    player.y + player.size - hitMargin > p.y &&
                    player.y + hitMargin < p.y + p.h
                ) {
                    damagePlayer(1);
                }

                const isFirstInWaveGroup = !p.isWaveLeader || projectiles.find(other => other.isWaveLeader && other.pairId === p.pairId) === p;
                if (p.typingPrompt && p.showPromptLabel !== false && isFirstInWaveGroup) {
                    const lx = p.isWordPrompt ? (p.x + p.w / 2 + 54) : (p.x + p.w / 2);
                    const ly = p.labelY !== undefined ? p.labelY : (p.y + p.h / 2);
                    ctx.save();
                    ctx.font = p.isWordPrompt ? 'bold 18px "Press Start 2P", monospace' : 'bold 26px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = '#000000';
                    ctx.strokeText(p.typingPrompt, lx, ly);
                    ctx.fillStyle = p.isMatched ? '#22c55e' : '#ff66cc';
                    ctx.fillText(p.typingPrompt, lx, ly);
                    ctx.restore();
                }

                if (!p.isWallSpike && !p.isGiantSlam && (p.x < -120 || p.x > w + 120 || p.y < -120 || p.y > h + 120)) {
                    projectiles.splice(i, 1);
                }
            }

            if (player.invuln > 0) player.invuln--;
            if (player.invuln === 0 || Math.floor(player.invuln / 3) % 2 === 0) {
                const heartColor = player.mode === 'BLUE' ? '#0055ff' : '#ff0000';
                drawPixelHeart(ctx, player.x, player.y, heartColor);
            }

            stepAutoMacro();

            ctx.restore();

            const bCanvas = document.getElementById('blaster-overlay-canvas');
            if (bCanvas) {
                bCanvas.width = window.innerWidth;
                bCanvas.height = window.innerHeight;
                const bCtx = bCanvas.getContext('2d');
                bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);

                const boxRect = canvas.getBoundingClientRect();

                for (let i = blasters.length - 1; i >= 0; i--) {
                    const b = blasters[i];
                    if (b.gatherDelay > 0) {
                        b.gatherDelay--;
                        continue;
                    }

                    b.timer++;
                    const sMult = b.scaleMult || 1.0;

                    if (b.trackPlayerUntilFire && b.timer < b.chargeTime - 24) {
                        const targetAng = Math.atan2((player.y + player.size / 2) - b.originY, (player.x + player.size / 2) - b.originX);
                        b.beamAngle += (targetAng - b.beamAngle) * 0.08;
                    }

                    const entryDuration = 18;
                    const entryT = Math.min(1, b.timer / entryDuration);
                    const easeOut = 1 - Math.pow(1 - entryT, 3);
                    const entryDist = (1 - easeOut) * (b.isMega ? 180 : 140);
                    const spinOffset = (1 - easeOut) * (b.isMega ? 0.5 : 1.4);

                    let recoilDist = 0;
                    if (b.timer > b.chargeTime) {
                        const fireElapsed = b.timer - b.chargeTime;
                        recoilDist = Math.min(b.isMega ? 38 : 26, fireElapsed * 2.4) + (fireElapsed * 0.65);
                    }

                    const totalBackOffset = entryDist + recoilDist;
                    const curOriginX = b.originX - Math.cos(b.beamAngle) * totalBackOffset;
                    const curOriginY = b.originY - Math.sin(b.beamAngle) * totalBackOffset;
                    const screenX = boxRect.left + curOriginX;
                    const screenY = boxRect.top + curOriginY;

                    if (b.timer <= b.chargeTime) {
                        const progress = b.timer / b.chargeTime;
                        const shake = b.isMega ? (progress * 5) : (progress > 0.7 ? 2 : 0);
                        const sx = screenX + (Math.random() - 0.5) * shake;
                        const sy = screenY + (Math.random() - 0.5) * shake;

                        if (entryT >= 0.75) {
                            bCtx.save();
                            bCtx.translate(sx, sy);
                            bCtx.rotate(b.beamAngle);
                            bCtx.strokeStyle = b.isMega ? `rgba(0, 255, 255, ${0.25 + progress * 0.55})` : 'rgba(255, 255, 255, 0.28)';
                            bCtx.lineWidth = b.isMega ? (4 + progress * 18) : 2;
                            bCtx.setLineDash([8, 8]);
                            bCtx.beginPath();
                            bCtx.moveTo(0, 0);
                            bCtx.lineTo(1400, 0);
                            bCtx.stroke();
                            bCtx.restore();
                        }

                        drawGasterBlasterHead(bCtx, sx, sy, b.beamAngle - Math.PI / 2 + spinOffset, false, sMult, b.isMega ? progress * 1.4 : progress * 0.6);

                        if (b.typingPrompt && b.showPromptLabel !== false) {
                            const labelOffset = (b.isWordPrompt ? 76 : 34) * Math.min(2.2, sMult);
                            const tx = sx - Math.cos(b.beamAngle) * labelOffset;
                            const ty = sy - Math.sin(b.beamAngle) * labelOffset;
                            bCtx.save();
                            bCtx.font = b.isWordPrompt ? 'bold 18px "Press Start 2P", monospace' : 'bold 28px "Press Start 2P", monospace';
                            bCtx.textAlign = 'center';
                            bCtx.textBaseline = 'middle';
                            bCtx.lineWidth = 5;
                            bCtx.strokeStyle = '#000000';
                            bCtx.strokeText(b.typingPrompt, tx, ty);
                            bCtx.fillStyle = b.isMatched ? '#22c55e' : '#ff66cc';
                            bCtx.fillText(b.typingPrompt, tx, ty);
                            bCtx.restore();
                        }
                    } else if (b.timer <= b.chargeTime + b.fireTime) {
                        if (!b.fired) {
                            b.fired = true;
                            audio.playBlasterFire();
                            if (b.isMega) screenShake.timer = 35;
                        }

                        const fireRatio = 1 - ((b.timer - b.chargeTime) / b.fireTime) * 0.35;
                        const beamWidth = (b.isMega ? (h + 90) : (26 * sMult)) * fireRatio;
                        const beamLen = 1500;

                        bCtx.save();
                        bCtx.translate(screenX, screenY);
                        bCtx.rotate(b.beamAngle);

                        bCtx.fillStyle = 'rgba(0, 255, 255, 0.35)';
                        bCtx.fillRect(0, -beamWidth * 0.65, beamLen, beamWidth * 1.3);

                        bCtx.fillStyle = '#ffffff';
                        bCtx.fillRect(0, -beamWidth * 0.45, beamLen, beamWidth * 0.9);
                        bCtx.restore();

                        const pCx = (player.x + player.size / 2) - b.originX;
                        const pCy = (player.y + player.size / 2) - b.originY;
                        const cosA = Math.cos(-b.beamAngle);
                        const sinA = Math.sin(-b.beamAngle);
                        const localX = pCx * cosA - pCy * sinA;
                        const localY = pCx * sinA + pCy * cosA;
                        if (localX >= -6 && localX <= beamLen && Math.abs(localY) <= beamWidth * 0.42 + 3) {
                            damagePlayer(1);
                        }

                        drawGasterBlasterHead(bCtx, screenX, screenY, b.beamAngle - Math.PI / 2, true, sMult, 0);
                    } else {
                        blasters.splice(i, 1);
                    }
                }

                if (typingState.sansBubblePrompt && typingState.sansBubbleGroupId) {
                    const hasRemainingGroupBlaster = blasters.some(b => b.circleGroupId === typingState.sansBubbleGroupId);
                    if (!hasRemainingGroupBlaster) {
                        typingState.sansBubblePrompt = '';
                        typingState.sansBubbleGroupId = 0;
                        typingState.sansBubbleMatched = false;
                        typingState.apocalypseQueue = [];
                        typingState.apocalypseGroupId = 0;
                        surroundingSaws = [];
                        updateSansPromptBubble();
                    }
                }
            }
        }

        function updateHpHud() {
            const hpFill = document.getElementById('hp-bar-fill');
            const hpText = document.getElementById('hp-text');
            const clampedHp = Math.max(0, gameState.hp);
            const pct = (clampedHp / gameState.maxHp) * 100;
            if (hpFill) hpFill.style.width = `${pct}%`;
            if (hpText) hpText.textContent = `${clampedHp} / ${gameState.maxHp}`;
        }

        function triggerGameOver() {
            gameState.phase = 'GAME_OVER';
            audio.stopBgm();
            if (battleAnimId) {
                cancelAnimationFrame(battleAnimId);
                battleAnimId = null;
            }
            const bCanvas = document.getElementById('blaster-overlay-canvas');
            if (bCanvas) {
                const bCtx = bCanvas.getContext('2d');
                bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
            }
            document.getElementById('sans-speech-container').style.display = 'none';
            setActionButtonsDisabled(true);
            showBattleBoxMode('result-overlay');

            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            title.textContent = 'GAME OVER';
            title.className = 'pixel-font text-xl sm:text-2xl text-red-500 font-bold';
            desc.textContent = `영혼이 산산조각 났다... | 최종 점수: ${gameState.score.toLocaleString()}점 (최대 콤보: ${gameState.maxCombo}x)`;
        }

        function damagePlayer(amount = 1) {
            if (gameState.testMode || gameState.hiddenStageTriggered) return;
            if (player.invuln > 0 || gameState.phase !== 'ENEMY_TURN') return;
            player.invuln = 30;
            gameState.hp = Math.max(0, gameState.hp - amount);
            updateHpHud();
            audio.playTone(120, 'sawtooth', 0.14, 0.1);
            screenShake.timer = 8;

            if (gameState.hp <= 0) {
                triggerGameOver();
            }
        }

        function endEnemyTurn() {
            if (battleAnimId) {
                cancelAnimationFrame(battleAnimId);
                battleAnimId = null;
            }
            typingState.currentInput = '';
            updateTypingHud();

            const bCanvas = document.getElementById('blaster-overlay-canvas');
            if (bCanvas) {
                const bCtx = bCanvas.getContext('2d');
                bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
            }

            const wrapper = document.getElementById('battle-box-wrapper');
            wrapper.style.borderColor = '#ffffff';
            wrapper.style.backgroundColor = '#000000';
            wrapper.style.maxWidth = '';
            wrapper.style.width = '100%';
            wrapper.style.height = '220px';
            document.getElementById('sans-container').style.transform = 'translateX(0px)';
            const speechText = document.getElementById('sans-speech-text');
            if (speechText) {
                speechText.style.color = '';
                speechText.style.fontWeight = '';
            }
            document.getElementById('sans-speech-container').style.display = 'none';
            typingState.sansBubblePrompt = '';
            typingState.sansBubbleGroupId = 0;
            typingState.sansBubbleMatched = false;
            typingState.apocalypseQueue = [];
            typingState.apocalypseGroupId = 0;

            gameState.turn++;
            const maxTurns = getActiveSequenceLength();

            if (gameState.hiddenStageTriggered) {
                const elapsedMs = Date.now() - (gameState.hiddenStageStartTime || Date.now());
                const twentyMinutesMs = 20 * 60 * 1000;
                if (elapsedMs >= twentyMinutesMs) {
                    triggerVictory();
                    return;
                }
                gameState.turn = 14;
                gameState.phase = 'PLAYER_MENU';
                setActionButtonsDisabled(false);
                showBattleBoxMode('dialogue-box');
                typeDialogue(`* 샌즈의 상태가 이상하다.`);
                return;
            }

            if (gameState.turn === 9 && maxTurns >= 12) {
                gameState.phase = 'DIALOGUE';
                gameState.postTurnQueue = PHASE9_SPARE_PROPOSAL_SCRIPT;
                gameState.postTurnIdx = 0;
                setActionButtonsDisabled(true);
                showBattleBoxMode('dialogue-box');
                const firstLine = PHASE9_SPARE_PROPOSAL_SCRIPT[0];
                drawOriginalSansSprite('battle-sans-canvas', firstLine.eyeMode || 'normal');
                typeDialogue(firstLine.text, true, 26, firstLine.bubble !== false);
                return;
            }

            if (gameState.turn >= maxTurns) {
                if (maxTurns >= 15) {
                    triggerSansSleepSequence();
                    return;
                }
                const finalLines = POST_TURN_DIALOGUE_SCRIPT[gameState.turn];
                if (finalLines && finalLines.length > 0) {
                    gameState.phase = 'DIALOGUE';
                    gameState.postTurnQueue = finalLines;
                    gameState.postTurnIdx = 0;
                    setActionButtonsDisabled(true);
                    showBattleBoxMode('dialogue-box');
                    const firstLine = finalLines[0];
                    drawOriginalSansSprite('battle-sans-canvas', firstLine.eyeMode || 'normal');
                    typeDialogue(firstLine.text, true, 26, firstLine.bubble !== false);
                    return;
                }
                triggerVictory();
                return;
            }

            gameState.phase = 'PLAYER_MENU';
            setActionButtonsDisabled(false);
            showBattleBoxMode('dialogue-box');

            typeDialogue(`* 당신은 성적이 떨어지는 것을 느꼈다.`);
        }

        function triggerSansSleepSequence() {
            gameState.phase = 'ENDING_SLEEP_DIALOGUE';
            audio.stopBgm();
            setActionButtonsDisabled(true);
            showBattleBoxMode('dialogue-box');

            const sleepScript = [
                { text: "이봐... 이정도면 충분한거 같은데...", eyeMode: 'slouch', bubble: true },
                { text: "* 샌즈는 피곤한 기색을 드러내고 있다.", eyeMode: 'closed', bubble: false },
                { text: "이제 잠깐 쉬는 거 어때?", eyeMode: 'closed', bubble: true },
                { text: "* 샌즈가 잠들었다. (Zzzz...)", eyeMode: 'closed', bubble: false }
            ];

            gameState.postTurnQueue = sleepScript;
            gameState.postTurnIdx = 0;
            const first = sleepScript[0];
            drawOriginalSansSprite('battle-sans-canvas', first.eyeMode);
            typeDialogue(first.text, true, 32, first.bubble);
        }

        function triggerEndingStrikeSequence() {
            gameState.phase = 'ENDING_CLIMAX';
            setActionButtonsDisabled(true);
            showBattleBoxMode('dialogue-box');

            const slashEl = document.getElementById('slash-effect');
            const slashCanvas = document.getElementById('slash-pixel-canvas');
            const missEl = document.getElementById('miss-popup');
            const dmgEl = document.getElementById('damage-99999-popup');
            const sansContainer = document.getElementById('sans-container');
            const speechContainer = document.getElementById('sans-speech-container');
            const speechEl = document.getElementById('sans-speech-text');
            const boxEl = document.getElementById('dialogue-text');

            if (boxEl) boxEl.textContent = '';
            if (speechContainer) speechContainer.style.display = 'none';
            document.getElementById('dialogue-next-hint').classList.add('hidden');

            audio.playSlash();
            drawOriginalSansSprite('battle-sans-canvas', 'empty');
            if (sansContainer) sansContainer.style.transform = 'translateX(-145px)';

            const playSlashCanvas = () => {
                if (!slashEl || !slashCanvas) return;
                slashEl.classList.remove('hidden');
                slashCanvas.classList.remove('slash-wave-primary');
                void slashCanvas.offsetWidth;
                slashCanvas.classList.add('slash-wave-primary');

                const sCtx = slashCanvas.getContext('2d');
                let frame = 0;
                const totalFrames = 10;
                const renderPixelSlash = () => {
                    sCtx.clearRect(0, 0, 128, 128);
                    const sweepProgress = Math.min(1, (frame + 1) / 3);
                    const totalSteps = 120;
                    const maxStep = Math.floor(sweepProgress * totalSteps);
                    const minStep = frame >= 6 ? Math.floor(((frame - 5) / 5) * totalSteps) : 0;
                    const fadeShrink = frame >= 6 ? Math.max(0.25, 1 - (frame - 5) * 0.18) : 1;

                    sCtx.fillStyle = '#ff1a1a';
                    for (let i = minStep; i <= maxStep; i++) {
                        const t = i / totalSteps;
                        const arcProfile = Math.sin(t * Math.PI);
                        const curveBend = arcProfile * 28;
                        const cx = Math.round(104 - t * 80 - curveBend);
                        const cy = Math.round(16 + t * 96 - curveBend * 0.72);
                        const bladeW = Math.max(1, Math.round((1 + Math.pow(arcProfile, 1.15) * 10) * fadeShrink));
                        const halfW = Math.floor(bladeW / 2);
                        sCtx.fillRect(cx - halfW, cy - halfW, bladeW, bladeW);
                    }
                    frame++;
                    if (frame < totalFrames) setTimeout(renderPixelSlash, 65);
                };
                renderPixelSlash();
            };

            playSlashCanvas();
            setTimeout(() => {
                if (missEl) missEl.classList.remove('hidden');
            }, 220);

            setTimeout(() => {
                if (slashEl) slashEl.classList.add('hidden');
                if (missEl) missEl.classList.add('hidden');
                if (sansContainer) sansContainer.style.transform = 'translateX(0px)';
                drawOriginalSansSprite('battle-sans-canvas', 'wink');

                const interruptText = "내가 그렇게 쉽게 맞아줄 것";
                if (speechContainer && speechEl) {
                    speechEl.textContent = '';
                    speechContainer.style.display = 'inline-block';
                }

                let idx = 0;
                const interruptTimer = setInterval(() => {
                    if (idx < interruptText.length) {
                        if (speechEl) speechEl.textContent += interruptText[idx];
                        if (interruptText[idx] !== ' ') audio.playSansVoice();
                        idx++;
                    } else {
                        clearInterval(interruptTimer);

                        setTimeout(() => {
                            audio.playSlash();
                            playSlashCanvas();

                            setTimeout(() => {
                                audio.playTone(95, 'sawtooth', 0.35, 0.14);
                                gameState.sansSlashedWound = true;
                                drawOriginalSansSprite('battle-sans-canvas', 'shocked');
                                if (dmgEl) dmgEl.classList.remove('hidden');

                                if (sansContainer) {
                                    const shakeOffsets = [
                                        'translate(-22px, -6px)',
                                        'translate(20px, 5px)',
                                        'translate(-18px, 4px)',
                                        'translate(16px, -5px)',
                                        'translate(-13px, 3px)',
                                        'translate(11px, -3px)',
                                        'translate(-8px, 2px)',
                                        'translate(6px, -2px)',
                                        'translate(-4px, 1px)',
                                        'translate(0px, 0px)'
                                    ];
                                    shakeOffsets.forEach((tf, sIdx) => {
                                        setTimeout(() => {
                                            sansContainer.style.transform = tf;
                                        }, sIdx * 55);
                                    });
                                }
                            }, 200);

                            setTimeout(() => {
                                if (slashEl) slashEl.classList.add('hidden');
                                if (dmgEl) dmgEl.classList.add('hidden');
                                if (sansContainer) sansContainer.style.transform = 'translate(0px, 0px)';

                                const finalEndingLines = [
                                    { text: "결국 이렇게 되는 건가", eyeMode: 'slouch' },
                                    { text: "...", eyeMode: 'closed' },
                                    { text: "좋아, 이제 집에 가도 돼", eyeMode: 'half_lids' }
                                ];

                                gameState.phase = 'ENDING_FINAL_DIALOGUE';
                                gameState.postTurnQueue = finalEndingLines;
                                gameState.postTurnIdx = 0;
                                const firstEndLine = finalEndingLines[0];
                                drawOriginalSansSprite('battle-sans-canvas', firstEndLine.eyeMode);
                                typeDialogue(firstEndLine.text, true, 48, true);
                            }, 1650);
                        }, 160);
                    }
                }, 38);
            }, 1050);
        }

        function triggerVictory() {
            gameState.phase = 'VICTORY';
            audio.stopBgm();
            setActionButtonsDisabled(true);
            showBattleBoxMode('result-overlay');

            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            title.textContent = 'LESSON CLEAR!';
            title.className = 'pixel-font text-xl sm:text-2xl text-yellow-400 font-bold';
            if (gameState.testMode) {
                desc.textContent = `난이도 ${DIFFICULTY_CONFIG[gameState.difficulty].name} 연습 완료! (TEST MODE - 점수 미기록)`;
            } else {
                desc.textContent = `난이도 ${DIFFICULTY_CONFIG[gameState.difficulty].name} 클리어! | 최종 점수: ${gameState.score.toLocaleString()}점 (최대 콤보: ${gameState.maxCombo}x)`;
            }
        }

        /* Keyboard Shortcuts */
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (!document.getElementById('lobby-screen').classList.contains('hidden')) {
                if (e.code === 'ArrowLeft') {
                    selectDifficulty(Math.max(1, gameState.difficulty - 1));
                } else if (e.code === 'ArrowRight') {
                    selectDifficulty(Math.min(5, gameState.difficulty + 1));
                } else if (e.code === 'Enter' || e.code === 'KeyZ') {
                    startGame();
                }
                return;
            }

            if (gameState.phase === 'ENEMY_TURN') {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!checkAutoMacroTrigger()) {
                        submitTypingBuffer();
                    }
                } else if (e.key === 'Backspace') {
                    e.preventDefault();
                    typingState.currentInput = typingState.currentInput.slice(0, -1);
                    refreshTypingHighlights();
                    updateTypingHud();
                } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    const hasMultiCharActive = projectiles.some(p => p.isWordPrompt) || blasters.some(b => b.isWordPrompt) || Boolean(typingState.sansBubblePrompt) || Boolean(slamState.active && slamState.typingPrompt) || slamWarnings.some(sw => sw.typingPrompt) || bombs.some(bm => bm.typingPrompt);
                    const nextBufLower = (typingState.currentInput + e.key).toLowerCase();
                    const isTypingMacroCode = 'wow!!!!!! sans'.startsWith(nextBufLower) || 'korean'.startsWith(nextBufLower);
                    if (hasMultiCharActive || isTypingMacroCode) {
                        typingState.currentInput += e.key;
                    } else if (/^[a-zA-Z]$/.test(e.key)) {
                        typingState.currentInput = e.key.toUpperCase();
                    }
                    checkAutoMacroTrigger();
                    refreshTypingHighlights();
                    updateTypingHud();
                }
                return;
            }

            if (e.key === 'Backspace') {
                e.preventDefault();
                typingState.currentInput = typingState.currentInput.slice(0, -1);
                updateTypingHud();
                return;
            }

            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.code !== 'KeyZ') {
                e.preventDefault();
                typingState.currentInput += e.key;
                checkAutoMacroTrigger();
                updateTypingHud();
                return;
            }

            if (e.code === 'KeyZ' || e.code === 'Enter') {
                if (gameState.phase === 'DIALOGUE' || gameState.phase === 'INTRO' || gameState.phase === 'ENDING_SLEEP_DIALOGUE' || gameState.phase === 'ENDING_FINAL_DIALOGUE' || gameState.phase === 'HIDDEN_PRE_DIALOGUE' || gameState.phase === 'HIDDEN_POST_DIALOGUE') {
                    handleBoxClick();
                } else if (gameState.phase === 'ENDING_SLEEP_PLAYER_TURN') {
                    selectAction('FIGHT');
                } else if (gameState.phase === 'PLAYER_MENU') {
                    selectAction('FIGHT');
                } else if (gameState.phase === 'ATTACK_MINIGAME') {
                    executePlayerSlash();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        const attackBox = document.getElementById('attack-minigame');
        if (attackBox) {
            attackBox.addEventListener('click', () => {
                if (gameState.phase === 'ATTACK_MINIGAME') {
                    executePlayerSlash();
                }
            });
        }

        window.onload = () => {
            selectDifficulty(3);
            drawOriginalSansSprite('lobby-sans-canvas', 'silhouette', 0);
            startSansIdleLoop();
        };
    </script>
</body>
</html>
