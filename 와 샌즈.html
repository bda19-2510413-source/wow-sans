<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어타자연습 리메이크</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Galmuri9', 'Press Start 2P', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .pixel-font {
            font-family: 'Press Start 2P', 'Galmuri9', monospace;
        }
        .kr-font {
            font-family: 'Galmuri9', 'Press Start 2P', monospace;
            letter-spacing: 0.04em;
        }
        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .ut-box {
            border: 4px solid #ffffff;
            background-color: #000000;
        }
        .ut-btn {
            border: 3px solid #ff8000;
            color: #ff8000;
            background-color: #000000;
            transition: all 0.08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
        .ut-btn .btn-heart {
            display: none;
        }
        .ut-btn:hover:not(:disabled),
        .ut-btn.active:not(:disabled) {
            border-color: #ffff00;
            color: #ffff00;
        }
        .ut-btn:hover:not(:disabled) .btn-icon,
        .ut-btn.active:not(:disabled) .btn-icon {
            display: none;
        }
        .ut-btn:hover:not(:disabled) .btn-heart,
        .ut-btn.active:not(:disabled) .btn-heart {
            display: inline-block;
        }
        .ut-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .speech-bubble {
            position: relative;
            display: inline-block;
            background: #ffffff;
            color: #000000;
            border-radius: 0;
            padding: 6px 8px;
            line-height: 1.25;
            box-shadow:
                0 -3px 0 0 #ffffff,
                0 3px 0 0 #ffffff,
                -3px 0 0 0 #ffffff,
                3px 0 0 0 #ffffff,
                0 -6px 0 0 #000000,
                0 6px 0 0 #000000,
                -6px 0 0 0 #000000,
                6px 0 0 0 #000000,
                -3px -3px 0 0 #000000,
                3px -3px 0 0 #000000,
                -3px 3px 0 0 #000000,
                3px 3px 0 0 #000000;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 9px;
            background: #ffffff;
            box-shadow:
                -3px 2px 0 0 #ffffff,
                -6px 4px 0 0 #ffffff,
                -3px 0 0 0 #000000,
                -6px 2px 0 0 #000000,
                -9px 4px 0 0 #000000,
                -6px 6px 0 0 #000000,
                -3px 9px 0 0 #000000;
        }
        @media (max-width: 639px) {
            .speech-bubble::before {
                left: 50%;
                top: -9px;
                transform: translateX(-50%);
                width: 12px;
                height: 3px;
                box-shadow:
                    3px -3px 0 0 #ffffff,
                    6px -6px 0 0 #ffffff,
                    0 -3px 0 0 #000000,
                    3px -6px 0 0 #000000,
                    6px -9px 0 0 #000000,
                    9px -6px 0 0 #000000,
                    12px -3px 0 0 #000000;
            }
        }
        @keyframes pixel-slash-step {
            0% {
                transform: translate(4px, -4px) scale(0.95);
                opacity: 1;
            }
            65% {
                transform: translate(0px, 0px) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-3px, 3px) scale(1);
                opacity: 0;
            }
        }
        .slash-wave-primary {
            animation: pixel-slash-step 0.85s steps(8, end) forwards;
        }
    </style>
</head>
<body class="w-screen h-screen bg-black text-white flex flex-col items-center justify-center relative">

    <!-- Flash Effect Overlay -->
    <div id="flash-overlay" class="pointer-events-none fixed inset-0 bg-white opacity-0 transition-opacity duration-300 z-50"></div>

    <!-- ==================== 1. LOBBY SCREEN ==================== -->
    <div id="lobby-screen" class="w-full max-w-[640px] flex flex-col items-center justify-center p-4 space-y-6 relative">
        <!-- Sans Silhouette Canvas in Lobby -->
        <div class="flex flex-col items-center justify-center">
            <canvas id="lobby-sans-canvas" width="230" height="210" class="pixel-art"></canvas>
        </div>

        <!-- Box & Title & 5-Step Difficulty Gauge Selector -->
        <div class="w-full ut-box p-6 flex flex-col items-center space-y-6">
            <h1 class="text-2xl sm:text-4xl font-bold tracking-wider kr-font text-white text-center">영어타자연습 리메이크</h1>

            <!-- 5-Step Gauge -->
            <div class="w-full max-w-md flex flex-col items-center space-y-3">
                <div id="diff-level-label" class="pixel-font text-base sm:text-lg font-bold text-yellow-400">
                    DIFFICULTY LV. 3 / 5
                </div>

                <!-- 5 Gauge Segments -->
                <div class="w-full grid grid-cols-5 gap-2 h-7 bg-black p-1 border-2 border-white rounded">
                    <button onclick="selectDifficulty(1)" id="diff-seg-1" class="h-full rounded-sm transition-colors duration-150 cursor-pointer"></button>
                    <button onclick="selectDifficulty(2)" id="diff-seg-2" class="h-full rounded-sm transition-colors duration-150 cursor-pointer"></button>
                    <button onclick="selectDifficulty(3)" id="diff-seg-3" class="h-full rounded-sm transition-colors duration-150 cursor-pointer"></button>
                    <button onclick="selectDifficulty(4)" id="diff-seg-4" class="h-full rounded-sm transition-colors duration-150 cursor-pointer"></button>
                    <button onclick="selectDifficulty(5)" id="diff-seg-5" class="h-full rounded-sm transition-colors duration-150 cursor-pointer"></button>
                </div>

                <div class="text-xs pixel-font text-gray-400 tracking-wider">
                    LV.1 ◄ / ► LV.5 OR CLICK GAUGE
                </div>
            </div>

            <!-- Test Mode Toggle -->
            <div class="w-full max-w-md flex items-center justify-between pt-2 border-t border-gray-800">
                <div class="flex flex-col">
                    <span class="pixel-font text-xs sm:text-sm text-cyan-400">TEST MODE</span>
                    <span class="kr-font text-xs text-gray-400">무적 상태 (HP 감소 없음 / 점수·콤보 미획득)</span>
                </div>
                <button onclick="toggleTestMode()" id="test-mode-btn" class="px-4 py-2 border-2 border-gray-600 text-gray-400 pixel-font text-xs sm:text-sm rounded transition-colors duration-150 cursor-pointer">
                    OFF
                </button>
            </div>
        </div>

        <!-- Start Button -->
        <div class="w-full max-w-md">
            <button onclick="startGame()" class="w-full py-4 ut-btn active text-xl sm:text-2xl font-bold pixel-font tracking-wider">
                <svg class="btn-heart w-6 h-6 pixel-art" viewBox="0 0 12 10"><path d="M2,0 h2 v1 h1 v1 h2 v-1 h1 v-1 h2 v1 h1 v1 h1 v3 h-1 v2 h-2 v1 h-2 v1 h-2 v-1 h-2 v-1 h-2 v-2 h-1 v-3 h1 v-1 h1 z" fill="#ff0000"/></svg>
                <span>START LESSON</span>
            </button>
        </div>
    </div>

    <!-- ==================== 2. MAIN BATTLE SCREEN ==================== -->
    <div id="battle-screen" class="hidden w-full max-w-[760px] flex flex-col items-center justify-between h-full max-h-[720px] py-4 px-2">
        <!-- Phase & Difficulty HUD (Top Left Corner) -->
        <div id="phase-hud" class="hidden fixed top-3 left-4 text-xs sm:text-sm pixel-font text-gray-400 z-20">
            PHASE <span id="phase-num" class="text-yellow-400">1</span>/<span id="max-phase-num">8</span> | DIFFICULTY <span id="hud-diff-val" class="text-white">LV.3</span><span id="hud-test-badge" class="hidden text-cyan-400 font-bold"> [TEST]</span>
        </div>

        <!-- Top: Sans Sprite & Speech Bubble -->
        <div class="w-full flex flex-col sm:flex-row items-center justify-center relative min-h-[215px]">
            <div id="sans-container" class="relative flex items-center justify-center transition-transform duration-200 z-10">
                <canvas id="battle-sans-canvas" width="230" height="210" class="pixel-art"></canvas>
            </div>

            <!-- Fixed Center Slash Effect & MISS -->
            <div id="slash-stage" class="pointer-events-none absolute inset-0 flex items-center justify-center z-20">
                <div id="slash-effect" class="hidden relative w-52 h-52 flex items-center justify-center translate-x-20 -rotate-[32deg]">
                    <canvas id="slash-pixel-canvas" width="128" height="128" class="w-full h-full pixel-art slash-wave-primary"></canvas>
                </div>

                <!-- MISS Popup -->
                <div id="miss-popup" class="hidden absolute top-2 text-2xl sm:text-3xl font-bold text-gray-300 pixel-font tracking-widest" style="text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;">
                    MISS
                </div>

                <!-- 99999 Damage Popup -->
                <div id="damage-99999-popup" class="hidden absolute top-1 text-3xl sm:text-4xl font-bold text-red-500 pixel-font tracking-widest" style="text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 0 0 12px rgba(255,0,0,0.8);">
                    99999
                </div>
            </div>

            <!-- Speech Bubble -->
            <div id="sans-speech-container" style="display: none;" class="sm:absolute sm:left-[calc(50%+88px)] sm:top-[22px] mt-2 sm:mt-0 max-w-[195px] z-40">
                <div class="speech-bubble text-[15px] sm:text-[16px] kr-font leading-[1.25] break-keep whitespace-pre-wrap"><span id="sans-speech-text"></span></div>
            </div>
        </div>

        <!-- Middle: Battle Box -->
        <div id="battle-box-wrapper" class="ut-box relative transition-all duration-300 flex items-center justify-center overflow-hidden" style="width: 100%; height: 220px;">
            
            <!-- Dialogue Box -->
            <div id="dialogue-box" class="w-full h-full p-4 sm:p-6 flex flex-col justify-between cursor-pointer" onclick="handleBoxClick()">
                <p id="dialogue-text" class="text-lg sm:text-2xl kr-font leading-relaxed text-white whitespace-pre-line"></p>
                <div id="dialogue-next-hint" class="hidden self-end text-yellow-400 text-xs sm:text-sm animate-pulse kr-font">
                    ▼ 클릭 또는 [Z / Enter] 로 계속
                </div>
            </div>

            <!-- Attack Minigame Bar -->
            <div id="attack-minigame" class="hidden w-full h-full relative flex items-center justify-center bg-black">
                <svg viewBox="0 0 500 180" class="w-full h-full opacity-90">
                    <ellipse cx="250" cy="90" rx="220" ry="75" fill="none" stroke="#ffffff" stroke-width="3"/>
                    <ellipse cx="250" cy="90" rx="140" ry="50" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6"/>
                    <ellipse cx="250" cy="90" rx="55" ry="22" fill="none" stroke="#facc15" stroke-width="3"/>
                    <line x1="250" y1="10" x2="250" y2="170" stroke="#ef4444" stroke-width="2"/>
                </svg>
                <div id="attack-cursor" class="absolute top-2 bottom-2 w-3 bg-white border-2 border-black" style="left: 10px;"></div>
                <p class="absolute bottom-2 text-xs text-gray-400 kr-font">중앙에 맞춰 [Z / Enter / 클릭]!</p>
            </div>

            <!-- Bullet Evade Canvas -->
            <canvas id="battle-canvas" class="hidden w-full h-full"></canvas>

            <!-- Gaster Blaster Overlay Canvas -->
            <canvas id="blaster-overlay-canvas" class="pointer-events-none fixed inset-0 z-30"></canvas>

            <!-- Result Overlay -->
            <div id="result-overlay" class="hidden w-full h-full p-4 flex flex-col items-center justify-center bg-black space-y-4">
                <p id="result-title" class="pixel-font text-xl sm:text-2xl text-red-500 font-bold">GAME OVER</p>
                <p id="result-desc" class="kr-font text-sm sm:text-base text-gray-300 text-center">영혼이 산산조각 났다...</p>
                <div class="flex space-x-3">
                    <button onclick="restartBattle()" class="ut-btn px-4 py-2 text-xs sm:text-sm font-bold pixel-font">RETRY</button>
                    <button onclick="returnToLobby()" class="ut-btn px-4 py-2 text-xs sm:text-sm font-bold pixel-font">LOBBY</button>
                </div>
            </div>
        </div>

        <!-- Bottom: Wide 2-Line Typing Box & HP Status Bar Below -->
        <div id="hp-container" class="hidden w-full mt-2 flex flex-col space-y-2 text-xs sm:text-base pixel-font">
            <div id="typing-hud" class="w-full min-h-[3.4rem] flex items-start justify-between px-4 py-2 bg-black border-2 border-pink-400">
                <div class="flex items-start space-x-2 flex-1 min-w-0">
                    <span class="text-pink-400 shrink-0 leading-snug">TYPE:</span>
                    <span id="typing-buffer-text" class="text-green-400 font-bold break-all whitespace-normal leading-snug line-clamp-2">_</span>
                </div>
                <span class="text-gray-400 text-[10px] sm:text-xs shrink-0 ml-2 self-center">[ENTER]</span>
            </div>
            
            <div class="w-full flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center space-x-3 sm:space-x-5 text-[11px] sm:text-xs">
                    <div class="flex items-center space-x-1.5">
                        <span class="text-yellow-400">SCORE</span>
                        <span id="score-text" class="text-white">0</span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span class="text-cyan-400">COMBO</span>
                        <span id="combo-text" class="text-white">0</span>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <span class="text-xs text-white">HP</span>
                    <div class="w-24 sm:w-32 h-5 bg-[#c00000] relative">
                        <div id="hp-bar-fill" class="h-full bg-[#ffff00] transition-all duration-100" style="width: 100%;"></div>
                        <div id="kr-bar-fill" class="h-full bg-[#ff00ff] absolute top-0 right-0 transition-all duration-100" style="width: 0%;"></div>
                    </div>
                    <span class="text-white text-xs">KR</span>
                    <span id="hp-text" class="text-white text-xs sm:text-base">92 / 92</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div id="action-buttons" class="w-full mt-2 grid grid-cols-2 gap-3 sm:gap-4">
            <button onclick="selectAction('FIGHT')" id="btn-FIGHT" class="ut-btn py-2.5 sm:py-3 text-sm sm:text-xl font-bold pixel-font">
                <svg class="btn-icon w-4 h-4 sm:w-5 sm:h-5 pixel-art" viewBox="0 0 12 12"><path d="M9,1 h2 v2 h-1 v1 h-1 v1 h-1 v1 h-1 v1 h1 v1 h-1 v1 h-1 v-1 h-1 v1 h-1 v1 h-1 v-1 h1 v-1 h-1 v-1 h1 v1 h1 v-1 h1 v-1 h1 v-1 h1 v-1 h1 z" fill="currentColor"/></svg>
                <svg class="btn-heart w-4 h-4 sm:w-5 sm:h-5 pixel-art" viewBox="0 0 12 10"><path d="M2,0 h2 v1 h1 v1 h2 v-1 h1 v-1 h2 v1 h1 v1 h1 v3 h-1 v2 h-2 v1 h-2 v1 h-2 v-1 h-2 v-1 h-2 v-2 h-1 v-3 h1 v-1 h1 z" fill="#ff0000"/></svg>
                <span>FIGHT</span>
            </button>
            <button onclick="returnToLobby()" id="btn-LOBBY" class="ut-btn py-2.5 sm:py-3 text-sm sm:text-xl font-bold pixel-font">
                <svg class="btn-icon w-4 h-4 sm:w-5 sm:h-5 pixel-art" viewBox="0 0 12 12"><path d="M5,2 h2 v2 h2 v2 h2 v4 h-3 v-3 h-4 v3 h-3 v-4 h2 v-2 h2 z" fill="currentColor"/></svg>
                <svg class="btn-heart w-4 h-4 sm:w-5 sm:h-5 pixel-art" viewBox="0 0 12 10"><path d="M2,0 h2 v1 h1 v1 h2 v-1 h1 v-1 h2 v1 h1 v1 h1 v3 h-1 v2 h-2 v1 h-2 v1 h-2 v-1 h-2 v-1 h-2 v-2 h-1 v-3 h1 v-1 h1 z" fill="#ff0000"/></svg>
                <span>LOBBY</span>
            </button>
        </div>
    </div>

    <script>
        /* Realistic Full-Orchestra & Rock Band Audio Engine */
        class RetroAudioEngine {
            constructor() {
                this.ctx = null;
                this.bgmTimer = null;
                this.birdsTimer = null;
                this.step = 0;
                this.masterGain = null;
                this.reverbNode = null;
                this.reverbGain = null;
                this.noiseBuffer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();

                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);

                    this.reverbNode = this.ctx.createConvolver();
                    const rate = this.ctx.sampleRate;
                    const length = Math.floor(rate * 1.45);
                    const impulse = this.ctx.createBuffer(2, length, rate);
                    for (let ch = 0; ch < 2; ch++) {
                        const data = impulse.getChannelData(ch);
                        for (let i = 0; i < length; i++) {
                            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.6);
                        }
                    }
                    this.reverbNode.buffer = impulse;

                    this.reverbGain = this.ctx.createGain();
                    this.reverbGain.gain.setValueAtTime(0.24, this.ctx.currentTime);
                    this.reverbNode.connect(this.reverbGain);
                    this.reverbGain.connect(this.masterGain);

                    const nLen = rate * 1.0;
                    this.noiseBuffer = this.ctx.createBuffer(1, nLen, rate);
                    const nData = this.noiseBuffer.getChannelData(0);
                    for (let i = 0; i < nLen; i++) {
                        nData[i] = Math.random() * 2 - 1;
                    }

                    this.guitarCurves = {};
                    [10, 14, 16, 18, 22].forEach((drive) => {
                        const samples = 256;
                        const curve = new Float32Array(samples);
                        for (let i = 0; i < samples; i++) {
                            const x = (i * 2) / samples - 1;
                            curve[i] = ((3 + drive) * x * 20 * (Math.PI / 180)) / (Math.PI + drive * Math.abs(x));
                        }
                        this.guitarCurves[drive] = curve;
                    });
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            connectWithReverb(node, wetAmount = 0.25) {
                node.connect(this.masterGain);
                if (this.reverbNode && wetAmount > 0) {
                    const send = this.ctx.createGain();
                    send.gain.setValueAtTime(wetAmount, this.ctx.currentTime);
                    node.connect(send);
                    send.connect(this.reverbNode);
                }
            }

            playTone(freq, type = 'square', duration = 0.08, volume = 0.05) {
                if (!this.ctx || freq <= 0) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playMenuMove() {
                this.playTone(480, 'square', 0.05, 0.04);
            }

            playSelect() {
                this.playTone(620, 'square', 0.06, 0.05);
                setTimeout(() => this.playTone(920, 'square', 0.09, 0.05), 55);
            }

            playSlash() {
                this.playTone(900, 'sawtooth', 0.06, 0.08);
                setTimeout(() => this.playTone(320, 'sawtooth', 0.14, 0.08), 50);
            }

            playSansVoice() {
                this.playTone(135, 'square', 0.042, 0.055);
            }

            playReveal() {
                this.playTone(110, 'sawtooth', 0.18, 0.09);
            }

            startBirdsAmbient() {
                if (this.birdsTimer) return;
                const chirp = () => {
                    if (!this.birdsTimer || !this.ctx || this.ctx.state !== 'running') return;
                    const now = this.ctx.currentTime;
                    const notes = 2 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < notes; i++) {
                        const t = now + i * 0.11;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        const baseFreq = 2400 + Math.random() * 1400;
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(baseFreq, t);
                        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.28, t + 0.04);
                        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, t + 0.08);
                        gain.gain.setValueAtTime(0.0001, t);
                        gain.gain.linearRampToValueAtTime(0.018, t + 0.015);
                        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
                        osc.connect(gain);
                        this.connectWithReverb(gain, 0.35);
                        osc.start(t);
                        osc.stop(t + 0.09);
                    }
                    this.birdsTimer = setTimeout(chirp, 900 + Math.random() * 1200);
                };
                this.birdsTimer = setTimeout(chirp, 120);
            }

            stopBirdsAmbient() {
                if (this.birdsTimer) {
                    clearTimeout(this.birdsTimer);
                    this.birdsTimer = null;
                }
            }

            playGlitchNoise() {
                if (!this.ctx || !this.noiseBuffer) return;
                const pulses = [0, 0.09];
                pulses.forEach((offset) => {
                    const t = this.ctx.currentTime + offset;
                    const src = this.ctx.createBufferSource();
                    src.buffer = this.noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1600, t);
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.08, t);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.masterGain);
                    src.start(t);
                    src.stop(t + 0.06);
                });
            }

            playBlasterCharge() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.38);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.41);
            }

            playBlasterFire() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(52, now + 0.32);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
                osc.connect(gain);
                gain.connect(this.masterGain);

                const SCORE_TIMELINE = [
                    { sec: 'A', bars: 4 },

                    if (currentSec === 'A') {

                            }
                        } else {
                            const isStabStep = (subStep === 0 || subStep === 2 || subStep === 4 || subStep === 7 || subStep === 9 || subStep === 11 || subStep === 15);
                            if (isStabStep) {
                                this.playPipeOrgan(b.chordTop, 0.24, 0.034, t);

                            const lhNote = b.lh[subStep];

                        if (subStep % 2 === 0) this.playHiHat(subStep === 14, 0.030, t);
                        if (subStep === 0 || subStep === 6 || subStep === 8 || subStep === 14) this.playAcousticKick(0.14, t);
                        if (subStep === 4 || subStep === 12) this.playAcousticSnare(0.088, t);
                    }
                };

                const scheduler = () => {
                    if (!this.bgmTimer) return;

                        }

                };

                            } else if ((mode === 'closed' || mode === 'shrug_closed') && r >= 11 && r <= 17) {
                                if ((c >= 18 && c <= 29) || (c >= 36 && c <= 47)) {
                                    if (
                                        (r === 12 && (c === 28 || c === 37)) ||
                                        (r === 13 && (c === 20 || c === 28 || c === 37 || c === 45)) ||
                                        (r === 14 && ((c >= 21 && c <= 28) || (c >= 37 && c <= 44))) ||
                                        (r === 15 && ((c >= 23 && c <= 27) || (c >= 38 && c <= 42)))
                                    ) {
                                        ch = 'K';
                                    } else {
                                        ch = 'W';
                                    }
                                }
                            } else if (mode === 'shocked' && r >= 10 && r <= 18) {
                                if ((r === 10 || r === 18) && ((c >= 20 && c <= 27) || (c >= 38 && c <= 45))) {
                                    ch = 'K';
                                } else if (r >= 13 && r <= 16 && ch === 'W') {
                                    if ((c >= 22 && c <= 27) || (c >= 39 && c <= 44)) {
                                        ch = 'K';
                                    }
                                } else if (r === 14 && (c === 24 || c === 41)) {
                                    ch = 'W';
                                }
                            } else if (mode === 'hood_hidden') {
                                if (r <= 27) {
                                    const isOuterHoodRim =
                                        r <= 1 ||
                                        (r === 2 && (c <= 22 || c >= 43)) ||
                                        (r >= 3 && r <= 16 && (c <= 16 || c >= 49)) ||
                                        (r >= 17 && r <= 20 && (c <= 17 || c >= 48)) ||
                                        (r >= 21 && (c <= 19 || c >= 46)) ||
                                        r === 27;
                                    ch = isOuterHoodRim ? 'W' : 'K';
                                }
                            }
                            ctx.fillStyle = ch === 'W' ? '#ffffff' : '#000000';
                            ctx.fillRect(offsetX + c * pixelSize + dx, offsetY + r * pixelSize + dy, pixelSize, pixelSize);
                        }
                    }
                };

                if (mode === 'hood_hidden') {
                    const now = Date.now();
                    const pulse = 0.92 + 0.14 * Math.sin(now * 0.009);
                    const bodyCx = canvas.width / 2;
                    const bodyCy = canvas.height * 0.52;
                    ctx.save();

                    const outerGrad = ctx.createRadialGradient(bodyCx, bodyCy, 14, bodyCx, bodyCy, 138 * pulse);
                    outerGrad.addColorStop(0, 'rgba(150, 245, 255, 0.72)');
                    outerGrad.addColorStop(0.32, 'rgba(0, 195, 255, 0.52)');
                    outerGrad.addColorStop(0.65, 'rgba(0, 95, 245, 0.28)');
                    outerGrad.addColorStop(1, 'rgba(0, 20, 140, 0)');
                    ctx.fillStyle = outerGrad;
                    ctx.beginPath();
                    ctx.arc(bodyCx, bodyCy, 138 * pulse, 0, Math.PI * 2);
                    ctx.fill();

                    const flameCols = [-76, -60, -45, -30, -15, 0, 15, 30, 45, 60, 76];
                    flameCols.forEach((ox, idx) => {
                        const wave = Math.sin(now * 0.015 + idx * 1.15);
                        const centerBoost = 1 - Math.min(1, Math.abs(ox) / 95);
                        const flameH = 68 + centerBoost * 46 + wave * 18;
                        const baseY = bodyCy + 78;
                        ctx.fillStyle = idx % 2 === 0 ? 'rgba(0, 215, 255, 0.44)' : 'rgba(56, 189, 248, 0.34)';
                        ctx.fillRect(bodyCx + ox - 8, baseY - flameH, 16, flameH);
                        ctx.fillStyle = 'rgba(195, 248, 255, 0.40)';
                        ctx.fillRect(bodyCx + ox - 4, baseY - flameH * 0.72, 8, flameH * 0.72);
                    });

                    for (let p = 0; p < 18; p++) {
                        const cycle = ((now * 0.0013) + p * 0.23) % 1;
                        const px = bodyCx + Math.sin(p * 2.3 + cycle * 4.5) * 88;
                        const py = (bodyCy + 82) - cycle * 175;
                        const alpha = (1 - cycle) * 0.85;
                        ctx.fillStyle = `rgba(140, 250, 255, ${alpha.toFixed(2)})`;
                        ctx.fillRect(Math.round(px), Math.round(py), 4, 4);

        function drawGasterBlasterHead(ctx, x, y, angle, isOpen, scaleMult = 1.0, mouthEnergy = 0, variant = 'normal') {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const px = 2.4 * scaleMult;
            const rows = GASTER_BLASTER_ROWS.length;
            const cols = GASTER_BLASTER_ROWS[0].length;
            const offsetX = -(cols * px) / 2;
            const offsetY = -(rows * px) / 2;
            const overlap = 0.65;
            const isDarkHidden = variant === 'korean';

            ctx.fillStyle = '#000000';
            for (let r = 0; r < rows; r++) {
                const rowStr = GASTER_BLASTER_ROWS[r];
                const jawShift = (isOpen && r >= 33) ? (10 * scaleMult) : 0;

                for (let c = 0; c < cols; c++) {
                    if (rowStr[c] !== '.') {
                        ctx.fillRect(offsetX + (c - 1) * px, offsetY + r * px + jawShift, px * 3 + overlap, px + overlap);
                        ctx.fillRect(offsetX + c * px, offsetY + (r - 1) * px + jawShift, px + overlap, px * 3 + overlap);
                    }
                }
            }

            if (isDarkHidden) {
                const auraGrad = ctx.createRadialGradient(0, 0, 8 * scaleMult, 0, 0, 56 * scaleMult);
                auraGrad.addColorStop(0, 'rgba(0, 220, 255, 0.45)');
                auraGrad.addColorStop(0.6, 'rgba(0, 100, 255, 0.18)');
                auraGrad.addColorStop(1, 'rgba(0, 30, 140, 0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 56 * scaleMult, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r = 0; r < rows; r++) {
                const rowStr = GASTER_BLASTER_ROWS[r];
                const jawShift = (isOpen && r >= 33) ? (10 * scaleMult) : 0;

                for (let c = 0; c < cols; c++) {
                    const ch = rowStr[c];
                    if (ch === '.') continue;
                    if (isDarkHidden) {
                        const isEyeCore = (r >= 18 && r <= 21) && ((c >= 10 && c <= 12) || (c >= 22 && c <= 24));
                        const isHornTip = (r <= 4 && ch === 'W') || (r >= 24 && r <= 26 && (c <= 3 || c >= 31));
                        if (isEyeCore) {
                            ctx.fillStyle = (r === 19 || r === 20) && (c === 11 || c === 23) ? '#ffffff' : '#00d8ff';
                        } else if (isHornTip) {
                            ctx.fillStyle = '#38bdf8';
                        } else {
                            ctx.fillStyle = ch === 'W' ? '#ffffff' : '#000000';
                        }
                    } else {
                        ctx.fillStyle = ch === 'W' ? '#ffffff' : '#000000';
                    }
                    ctx.fillRect(offsetX + c * px, offsetY + r * px + jawShift, px + overlap, px + overlap);
                }
            }

            if (isDarkHidden) {
                const eyePositions = [
                    { ex: offsetX + 11.5 * px, ey: offsetY + 20 * px },
                    { ex: offsetX + 23.5 * px, ey: offsetY + 20 * px }
                ];
                eyePositions.forEach(({ ex, ey }) => {
                    const eg = ctx.createRadialGradient(ex, ey, 0.5, ex, ey, 11 * scaleMult);
                    eg.addColorStop(0, 'rgba(200, 255, 255, 0.95)');
                    eg.addColorStop(0.5, 'rgba(0, 210, 255, 0.55)');
                    eg.addColorStop(1, 'rgba(0, 120, 255, 0)');
                    ctx.fillStyle = eg;
                    ctx.beginPath();
                    ctx.arc(ex, ey, 11 * scaleMult, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            if (mouthEnergy > 0) {
                const mouthY = offsetY + 34 * px;
                const energyR = mouthEnergy * px * 2.6;
                ctx.fillStyle = isDarkHidden ? 'rgba(0, 225, 255, 0.85)' : 'rgba(0, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(0, mouthY, energyR, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, mouthY, energyR * 0.55, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

            if (!list || list.length === 0) return '';

        function getPromptCategory(promptStr) {
            const trimmed = (promptStr || '').trim();
            if (trimmed.length <= 1) return 'ALPHABET';

        function awardTypingScore(promptStr) {
            if (gameState.testMode) return;
            const category = getPromptCategory(promptStr);
            const basePoints = category === 'SENTENCE' ? 600 : (category === 'WORD' ? 250 : 100);
            const diffMult = 1 + (gameState.difficulty - 1) * 0.35;

            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) {
                gameState.maxCombo = gameState.combo;
            }

            const comboBonusMult = 1 + Math.min(2.0, (gameState.combo - 1) * 0.05);
            const gained = Math.round(basePoints * diffMult * comboBonusMult);
            gameState.score += gained;
            updateScoreHud();

            }
            for (let i = 0; i < projectiles.length; i++) {
                if (projectiles[i].typingPrompt && projectiles[i].showPromptLabel !== false) {
                    return projectiles[i].typingPrompt;
                }
            }
            for (let i = 0; i < blasters.length; i++) {
                if (blasters[i].typingPrompt && blasters[i].showPromptLabel !== false) {
                    return blasters[i].typingPrompt;
                }
            }
            return '';

        function stepAutoMacro() {
            if (!typingState.autoMacroEnabled || gameState.phase !== 'ENEMY_TURN') return;
            const target = getActiveMacroTargetPrompt();
            if (!target) {
                if (typingState.currentInput.length > 0) {
                    typingState.currentInput = '';
                    refreshTypingHighlights();
                    updateTypingHud();
                }
                return;
            }
            if (!target.toLowerCase().startsWith(typingState.currentInput.toLowerCase())) {
                typingState.currentInput = '';
            }
            typingState.autoMacroTimer++;
            const stepDelay = typingState.currentInput.length >= target.length ? 5 : 4;
            if (typingState.autoMacroTimer < stepDelay) return;
            typingState.autoMacroTimer = 0;

            if (typingState.currentInput.length < target.length) {
                typingState.currentInput += target[typingState.currentInput.length];
                refreshTypingHighlights();
                updateTypingHud();
            } else {
                submitTypingBuffer();
            }
        }

        function submitTypingBuffer() {
            const typed = typingState.currentInput.trim().toUpperCase();
            if (!typed) return;

            let clearedAny = false;
            let clearedPromptText = '';

            if (typingState.sansBubblePrompt && typingState.sansBubblePrompt.toUpperCase() === typed) {
                clearedPromptText = typingState.sansBubblePrompt;
                const targetGroup = typingState.sansBubbleGroupId;
                if (typingState.apocalypseQueue && typingState.apocalypseQueue.length > 0 && typingState.apocalypseGroupId === targetGroup) {
                    typingState.apocalypseQueue.shift();
                    if (typingState.apocalypseQueue.length > 0) {
                        typingState.sansBubblePrompt = typingState.apocalypseQueue[0];
                        typingState.sansBubbleMatched = false;
                        updateSansPromptBubble();
                    } else {
                        for (let i = blasters.length - 1; i >= 0; i--) {
                            if (blasters[i].circleGroupId === targetGroup) {
                                blasters.splice(i, 1);
                            }
                        }
                        surroundingSaws = [];
                        typingState.sansBubblePrompt = '';
                        typingState.sansBubbleGroupId = 0;
                        typingState.sansBubbleMatched = false;
                        typingState.apocalypseGroupId = 0;
                        updateSansPromptBubble();
                    }
                    clearedAny = true;
                } else {
                    for (let i = blasters.length - 1; i >= 0; i--) {
                        if (blasters[i].circleGroupId === targetGroup) {
                            blasters.splice(i, 1);
                        }
                    }
                    typingState.sansBubblePrompt = '';
                    typingState.sansBubbleGroupId = 0;
                    typingState.sansBubbleMatched = false;
                    updateSansPromptBubble();
                    clearedAny = true;
                }
            }

            if (!clearedAny && slamState.active && slamState.typingPrompt && slamState.typingPrompt.toUpperCase() === typed) {
                clearedPromptText = slamState.typingPrompt;
                slamState.typingPrompt = '';
                slamState.isMatched = false;
                slamState.negated = true;
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    if (projectiles[j].isWallSpike) {
                        projectiles.splice(j, 1);
                    }
                }
                if (slamState.phase === 'PRE_SPIKE_WARN') {
                    slamState.active = false;
                    player.mode = 'RED';
                    const canvas = document.getElementById('battle-canvas');
                    if (canvas) {
                        player.x = canvas.width / 2 - player.size / 2;
                        player.y = canvas.height / 2 - player.size / 2;
                    }
                }
                clearedAny = true;
            }

            if (!clearedAny) {
                for (let i = slamWarnings.length - 1; i >= 0; i--) {
                    const sw = slamWarnings[i];
                    if (sw.typingPrompt && sw.typingPrompt.toUpperCase() === typed) {
                        clearedPromptText = sw.typingPrompt;
                        slamWarnings.splice(i, 1);
                        clearedAny = true;
                        break;
                    }
                }
            }

            if (!clearedAny) {
                for (let i = bombs.length - 1; i >= 0; i--) {
                    const bm = bombs[i];
                    if (bm.typingPrompt && bm.typingPrompt.toUpperCase() === typed) {
                        clearedPromptText = bm.typingPrompt;
                        shockwaves.push({ x: bm.x, y: bm.y, r: 6, maxR: 48, life: 12, color: '#22c55e' });

                        if (p.pairId !== undefined) {
                            const targetPair = p.pairId;
                            for (let j = projectiles.length - 1; j >= 0; j--) {

                                }

                        }

                        break;

            { text: "새들은 지저귀고", silhouette: false, bgm: false, birds: true, eyeMode: 'closed', bubble: true },
            { text: "꽃들은 피어나지...", silhouette: false, bgm: false, birds: true, eyeMode: 'closed', bubble: true },
            { text: "이런 날엔....", silhouette: false, bgm: false, birds: true, eyeMode: 'normal', bubble: true },
            { text: "너 같은 아이는 교실에서 공부나 해야해.", silhouette: false, bgm: false, birds: true, glitch: true, eyeMode: 'empty', speedMs: 85, bubble: true },
            { text: "* 당신은 끔찍한 시간을 보내게 될 것 같은 기분이 든다.", silhouette: false, bgm: true, birds: false, eyeMode: 'empty', bubble: false }
        ];

        function typeDialogue(text, showNextHint = false, speedMs = 26, useSpeechBubble = false) {
            if (typingTimer) clearInterval(typingTimer);
            const boxEl = document.getElementById('dialogue-text');
            const hint = document.getElementById('dialogue-next-hint');
            const speechContainer = document.getElementById('sans-speech-container');
            const speechEl = document.getElementById('sans-speech-text');
            if (!boxEl) return;

            currentFullDialogue = text;
            if (hint) hint.classList.add('hidden');
            isTyping = true;

            let targetEl = boxEl;
            if (useSpeechBubble && speechContainer && speechEl) {
                boxEl.textContent = '';
                speechEl.textContent = '';
                speechContainer.style.display = 'none';
                targetEl = speechEl;
            } else {
                if (speechContainer) speechContainer.style.display = 'none';
                boxEl.textContent = '';
                targetEl = boxEl;
            }

            let idx = 0;
            typingTimer = setInterval(() => {
                if (idx < text.length) {
                    if (useSpeechBubble && speechContainer && idx === 0) {
                        speechContainer.style.display = 'inline-block';
                    }
                    targetEl.textContent += text[idx];
                    if (text[idx] !== ' ' && text[idx] !== '\n' && (speedMs > 40 || idx % 2 === 0)) {
                        audio.playSansVoice();
                    }
                    idx++;
                } else {
                    clearInterval(typingTimer);
                    typingTimer = null;
                    isTyping = false;
                    if (hint && showNextHint) hint.classList.remove('hidden');
                }
            }, speedMs);
        }

        function handleBoxClick() {
            if (gameState.phase !== 'DIALOGUE' && gameState.phase !== 'INTRO' && gameState.phase !== 'ENDING_SLEEP_DIALOGUE' && gameState.phase !== 'ENDING_FINAL_DIALOGUE' && gameState.phase !== 'HIDDEN_PRE_DIALOGUE' && gameState.phase !== 'HIDDEN_POST_DIALOGUE') return;
            if (isTyping) {
                if (typingTimer) clearInterval(typingTimer);
                typingTimer = null;
                isTyping = false;
                const currentStep = gameState.phase === 'INTRO' ? INTRO_DIALOGUE_SCRIPT[introStepIndex] : null;
                const isPostTurnSpeech = gameState.postTurnQueue && gameState.postTurnQueue.length > 0;
                const currentPostLine = isPostTurnSpeech ? gameState.postTurnQueue[gameState.postTurnIdx] : null;
                if ((currentStep && currentStep.bubble) || gameState.postDodgeDialogue || (currentPostLine && currentPostLine.bubble !== false)) {
                    document.getElementById('sans-speech-container').style.display = 'inline-block';
                    document.getElementById('sans-speech-text').textContent = currentFullDialogue;
                } else {
                    document.getElementById('dialogue-text').textContent = currentFullDialogue;
                }
                document.getElementById('dialogue-next-hint').classList.remove('hidden');
                return;
            }

            if (gameState.phase === 'HIDDEN_PRE_DIALOGUE') {
                gameState.postTurnIdx++;
                if (gameState.postTurnIdx < gameState.postTurnQueue.length) {
                    const nextLine = gameState.postTurnQueue[gameState.postTurnIdx];
                    drawOriginalSansSprite('battle-sans-canvas', nextLine.eyeMode || 'empty');
                    typeDialogue(nextLine.text, true, 42, nextLine.bubble !== false);
                    return;
                }
                gameState.postTurnQueue = [];
                gameState.postTurnIdx = 0;
                document.getElementById('dialogue-next-hint').classList.add('hidden');
                document.getElementById('sans-speech-container').style.display = 'none';
                completeHiddenKoreanTransform();
                return;
            }

            if (gameState.phase === 'HIDDEN_POST_DIALOGUE') {
                gameState.postTurnIdx++;
                if (gameState.postTurnIdx < gameState.postTurnQueue.length) {
                    const nextLine = gameState.postTurnQueue[gameState.postTurnIdx];
                    typeDialogue(nextLine.text, true, 36, nextLine.bubble !== false);
                    return;
                }
                gameState.postTurnQueue = [];
                gameState.postTurnIdx = 0;
                document.getElementById('dialogue-next-hint').classList.add('hidden');
                document.getElementById('sans-speech-container').style.display = 'none';
                audio.startBgm();
                gameState.turn = 14;
                gameState.phase = 'PLAYER_MENU';
                setActionButtonsDisabled(false);
                typeDialogue(`* 샌즈의 상태가 이상하다.`);
                return;
            }

            if (gameState.phase === 'ENDING_SLEEP_DIALOGUE') {
                gameState.postTurnIdx++;
                if (gameState.postTurnIdx < gameState.postTurnQueue.length) {
                    const nextLine = gameState.postTurnQueue[gameState.postTurnIdx];
                    drawOriginalSansSprite('battle-sans-canvas', nextLine.eyeMode || 'closed');
                    typeDialogue(nextLine.text, true, 32, nextLine.bubble !== false);
                    return;
                }
                gameState.postTurnQueue = [];
                gameState.postTurnIdx = 0;
                drawOriginalSansSprite('battle-sans-canvas', 'closed');
                document.getElementById('sans-speech-container').style.display = 'none';
                document.getElementById('dialogue-next-hint').classList.add('hidden');
                gameState.phase = 'ENDING_SLEEP_PLAYER_TURN';
                setActionButtonsDisabled(false);
                typeDialogue(`* 샌즈가 쿨쿨 잠들어 있다. 지금이라면 공격할 수 있을 것 같다.`);
                return;
            }

            if (gameState.phase === 'ENDING_FINAL_DIALOGUE') {
                gameState.postTurnIdx++;
                if (gameState.postTurnIdx < gameState.postTurnQueue.length) {
                    const nextLine = gameState.postTurnQueue[gameState.postTurnIdx];
                    drawOriginalSansSprite('battle-sans-canvas', nextLine.eyeMode || 'slouch');
                    typeDialogue(nextLine.text, true, 48, true);
                    return;
                }
                gameState.postTurnQueue = [];
                gameState.postTurnIdx = 0;
                document.getElementById('sans-speech-container').style.display = 'none';
                document.getElementById('dialogue-next-hint').classList.add('hidden');
                triggerVictory();
                return;
            }

            if (gameState.postDodgeDialogue) {
                gameState.postDodgeDialogue = false;
                drawOriginalSansSprite('battle-sans-canvas', 'normal');
                document.getElementById('dialogue-next-hint').classList.add('hidden');
                document.getElementById('sans-speech-container').style.display = 'none';
                startEnemyTurn();
                return;
            }

            if (gameState.postTurnQueue && gameState.postTurnQueue.length > 0) {
                const finishedLine = gameState.postTurnQueue[gameState.postTurnIdx];
                if (finishedLine && finishedLine.enterPlayerTurn) {
                    gameState.postTurnQueue = [];
                    gameState.postTurnIdx = 0;
                    drawOriginalSansSprite('battle-sans-canvas', 'normal');
                    document.getElementById('sans-speech-container').style.display = 'none';
                    document.getElementById('dialogue-next-hint').classList.add('hidden');
                    gameState.phase = 'PLAYER_MENU';
                    setActionButtonsDisabled(false);
                    return;
                }
                gameState.postTurnIdx++;
                if (gameState.postTurnIdx < gameState.postTurnQueue.length) {
                    const nextLine = gameState.postTurnQueue[gameState.postTurnIdx];
                    drawOriginalSansSprite('battle-sans-canvas', nextLine.eyeMode || 'normal');
                    typeDialogue(nextLine.text, true, 26, nextLine.bubble !== false);
                    return;
                }
                gameState.postTurnQueue = [];
                gameState.postTurnIdx = 0;
                drawOriginalSansSprite('battle-sans-canvas', gameState.hiddenStageTriggered ? 'hood_hidden' : 'normal');
                document.getElementById('sans-speech-container').style.display = 'none';
                document.getElementById('dialogue-next-hint').classList.add('hidden');
                if (!gameState.hiddenStageTriggered && gameState.turn >= getActiveSequenceLength()) {
                    triggerVictory();
                } else {
                    startEnemyTurn();
                }
                return;
            }

            if (gameState.phase === 'INTRO') {
                introStepIndex++;
                if (introStepIndex < INTRO_DIALOGUE_SCRIPT.length) {
                    playIntroStep(introStepIndex);
                    return;
                }
                audio.stopBirdsAmbient();
                drawOriginalSansSprite('battle-sans-canvas', 'normal');
            }

            gameState.phase = 'PLAYER_MENU';
            setActionButtonsDisabled(false);
            document.getElementById('dialogue-next-hint').classList.add('hidden');
            typeDialogue(`* 당신은 성적이 떨어지는 것을 느꼈다.`);
        }

        function playIntroStep(index) {
            const step = INTRO_DIALOGUE_SCRIPT[index];
            if (!step) return;

            if (step.birds) {
                audio.startBirdsAmbient();
            } else {
                audio.stopBirdsAmbient();
            }

            if (step.glitch) {
                audio.playGlitchNoise();
            }

            if (step.reveal) {
                audio.playReveal();
                const flash = document.getElementById('flash-overlay');
                if (flash) {
                    flash.style.opacity = '0.75';
                    setTimeout(() => { flash.style.opacity = '0'; }, 140);
                }
            }

            if (step.bgm) {
                audio.startBgm();
            }

            if (step.silhouette) {
                drawOriginalSansSprite('battle-sans-canvas', 'silhouette');
            } else {
                drawOriginalSansSprite('battle-sans-canvas', step.eyeMode || 'normal');
            }

            typeDialogue(step.text, true, step.speedMs || 26, Boolean(step.bubble));
        }

            }

            const renderHiddenBlasters = () => {
                if (!gameState.hiddenStageTriggered || gameState.phase === 'LOBBY') return;
                if (!document.getElementById('battle-screen').classList.contains('hidden')) {
                    drawOriginalSansSprite('battle-sans-canvas', 'hood_hidden', sansAnimFrame);

                    const ovCtx = ovCanvas.getContext('2d');
                    ovCtx.clearRect(0, 0, ovCanvas.width, ovCanvas.height);

                    const t = Date.now() * 0.004;
                    const bobL = Math.sin(t) * 6;
                    const bobR = Math.sin(t + Math.PI) * 6;
                    const pulseEnergy = 0.72 + 0.25 * Math.sin(t * 2.2);

                    const rect = sansCanvas.getBoundingClientRect();
                    const centerY = rect.top + rect.height * 0.56;
                    const leftBlasterX = rect.left - 48;
                    const rightBlasterX = rect.right + 48;

                    drawGasterBlasterHead(ovCtx, leftBlasterX, centerY + bobL, -0.24, false, 1.35, pulseEnergy, 'korean');
                    drawGasterBlasterHead(ovCtx, rightBlasterX, centerY + bobR, 0.24, false, 1.35, pulseEnergy, 'korean');
                }
                requestAnimationFrame(renderHiddenBlasters);
            };
            renderHiddenBlasters();

            const hiddenPostScript = [
                { text: "듀오링고말이 맞았어.", bubble: true },

        /* Attack Minigame */
        let attackAnimId = null;
        let lastAttackFrameTime = 0;
        let cursorX = 10;
        let cursorDir = 1;

        function selectAction(action) {
            if (action !== 'FIGHT') return;
            if (gameState.phase === 'ENDING_SLEEP_PLAYER_TURN') {
                audio.playSelect();
                triggerEndingStrikeSequence();
                return;
            }
            if (gameState.phase !== 'PLAYER_MENU') return;
            audio.playSelect();
            gameState.phase = 'ATTACK_MINIGAME';
            setActionButtonsDisabled(true);
            showBattleBoxMode('attack-minigame');

            const box = document.getElementById('attack-minigame');
            const cursor = document.getElementById('attack-cursor');
            cursorX = 10;
            cursorDir = 1;
            lastAttackFrameTime = performance.now();

            function moveCursor(now) {
                if (gameState.phase !== 'ATTACK_MINIGAME') return;
                attackAnimId = requestAnimationFrame(moveCursor);

                const elapsed = now - lastAttackFrameTime;
                if (elapsed < 1000 / 62) return;
                lastAttackFrameTime = now - (elapsed % (1000 / 60));

                const maxW = Math.max(200, box.clientWidth - 20);
                cursorX += cursorDir * 9;
                if (cursorX >= maxW) {
                    cursorX = maxW;
                    cursorDir = -1;
                } else if (cursorX <= 10) {
                    cursorX = 10;
                    cursorDir = 1;
                }
                cursor.style.left = cursorX + 'px';
            }
            attackAnimId = requestAnimationFrame(moveCursor);
        }

        function executePlayerSlash() {
            if (gameState.phase !== 'ATTACK_MINIGAME') return;
            gameState.phase = 'PLAYER_ATTACKING';
            if (attackAnimId) {
                cancelAnimationFrame(attackAnimId);
                attackAnimId = null;
            }
            audio.playSlash();

            const slashEl = document.getElementById('slash-effect');
            const slashCanvas = document.getElementById('slash-pixel-canvas');
            const missEl = document.getElementById('miss-popup');
            const sansContainer = document.getElementById('sans-container');

            if (sansContainer) {
                sansContainer.style.transform = 'translateX(-145px)';
            }

            if (slashEl) slashEl.classList.remove('hidden');
            if (missEl) missEl.classList.add('hidden');

            if (slashCanvas) {
                slashCanvas.classList.remove('slash-wave-primary');
                void slashCanvas.offsetWidth;
                slashCanvas.classList.add('slash-wave-primary');

                const sCtx = slashCanvas.getContext('2d');
                let frame = 0;
                const totalFrames = 10;
                const renderPixelSlash = () => {
                    sCtx.clearRect(0, 0, 128, 128);

                    const sweepProgress = Math.min(1, (frame + 1) / 3);
                    const totalSteps = 120;
                    const maxStep = Math.floor(sweepProgress * totalSteps);
                    const minStep = frame >= 6 ? Math.floor(((frame - 5) / 5) * totalSteps) : 0;

                    const pts = [];
                    const fadeShrink = frame >= 6 ? Math.max(0.25, 1 - (frame - 5) * 0.18) : 1;
                    for (let i = minStep; i <= maxStep; i++) {
                        const t = i / totalSteps;
                        const arcProfile = Math.sin(t * Math.PI);
                        const curveBend = arcProfile * 28;
                        const cx = Math.round(104 - t * 80 - curveBend);
                        const cy = Math.round(16 + t * 96 - curveBend * 0.72);
                        const bladeW = Math.max(1, Math.round((1 + Math.pow(arcProfile, 1.15) * 10) * fadeShrink));
                        pts.push({ cx, cy, bladeW });
                    }

                    sCtx.fillStyle = '#ff1a1a';
                    for (const p of pts) {
                        const halfW = Math.floor(p.bladeW / 2);
                        sCtx.fillRect(p.cx - halfW, p.cy - halfW, p.bladeW, p.bladeW);
                    }

                    frame++;
                    if (frame < totalFrames) {
                        setTimeout(renderPixelSlash, 70);
                    }
                };
                renderPixelSlash();
            }

            setTimeout(() => {
                if (missEl) missEl.classList.remove('hidden');
            }, 240);

            setTimeout(() => {
                if (slashEl) slashEl.classList.add('hidden');
                if (missEl) missEl.classList.add('hidden');
                if (sansContainer) sansContainer.style.transform = 'translateX(0px)';

                if (gameState.hiddenStageTriggered) {
                    const hiddenDodgeLines = [
                        { text: "이게 너의 마지막 공격이었을 텐데", eyeMode: 'hood_hidden', bubble: true },
                        { text: "아깝게 됐군", eyeMode: 'hood_hidden', bubble: true }
                    ];
                    gameState.phase = 'DIALOGUE';
                    gameState.postTurnQueue = hiddenDodgeLines;
                    gameState.postTurnIdx = 0;
                    showBattleBoxMode('dialogue-box');
                    drawOriginalSansSprite('battle-sans-canvas', 'hood_hidden');
                    typeDialogue(hiddenDodgeLines[0].text, true, 32, true);
                    return;
                }

                if (gameState.turn === 0) {
                    gameState.phase = 'DIALOGUE';
                    gameState.postDodgeDialogue = true;
                    drawOriginalSansSprite('battle-sans-canvas', 'shrug');
                    showBattleBoxMode('dialogue-box');
                    typeDialogue("뭐?,내가 가만히 서서 맞아줄 거라 생각했어?", true, 28, true);
                } else {
                    const postLines = POST_TURN_DIALOGUE_SCRIPT[gameState.turn];
                    if (postLines && postLines.length > 0) {
                        gameState.phase = 'DIALOGUE';
                        gameState.postTurnQueue = postLines;
                        gameState.postTurnIdx = 0;
                        showBattleBoxMode('dialogue-box');
                        const firstLine = postLines[0];
                        drawOriginalSansSprite('battle-sans-canvas', firstLine.eyeMode || 'normal');
                        typeDialogue(firstLine.text, true, 26, true);
                    } else {
                        startEnemyTurn();
                    }
                }
            }, 1150);
        }

        /* Enemy Turn & Bullet Hell Engine */
        let battleAnimId = null;
        let lastBattleFrameTime = 0;
        let projectiles = [];
        let blasters = [];
        let bombs = [];
        let surroundingSaws = [];
        let shockwaves = [];
        let platforms = [];
        let slamWarnings = [];
        let slamState = { active: false, dir: null, phase: 'NONE', timer: 0 };
        let screenShake = { x: 0, y: 0, timer: 0 };
        let turnFrame = 0;
        let maxTurnFrames = 380;

        function startEnemyTurn() {
            gameState.phase = 'ENEMY_TURN';
            setActionButtonsDisabled(true);
            showBattleBoxMode('battle-canvas');

            refreshTypingHighlights();
            updateTypingHud();

            const pattern = getCurrentPattern();
            if (gameState.hiddenStageTriggered) {
                const phaseHud = document.getElementById('phase-hud');
                if (phaseHud) {
                    phaseHud.innerHTML = `PHASE <span class="text-cyan-400 font-bold">???</span> | DIFFICULTY <span class="text-pink-400 font-bold">???</span>`;
                }
            } else {
                const phaseNumEl = document.getElementById('phase-num');
                const maxPhaseEl = document.getElementById('max-phase-num');
                const hudDiffEl = document.getElementById('hud-diff-val');
                if (phaseNumEl) phaseNumEl.textContent = pattern.phase;
                if (maxPhaseEl) maxPhaseEl.textContent = getActiveSequenceLength();
                if (hudDiffEl) hudDiffEl.textContent = `LV.${gameState.difficulty}`;
            }

            turnFrame = 0;
            maxTurnFrames = pattern.duration;
            projectiles = [];
            blasters = [];
            bombs = [];
            surroundingSaws = [];
            shockwaves = [];
            platforms = [];
            slamWarnings = [];
            slamState = { active: false, dir: null, phase: 'NONE', timer: 0 };
            typingState.waveGroupPrompt = '';
            typingState.waveGroupPairId = 0;
            typingState.waveLastGroupIndex = -1;
            typingState.sansBubblePrompt = '';
            typingState.sansBubbleGroupId = 0;
            typingState.sansBubbleMatched = false;
            typingState.apocalypseQueue = [];
            typingState.apocalypseGroupId = 0;

            player.mode = 'RED';
            player.invuln = 0;

            const wrapper = document.getElementById('battle-box-wrapper');
            const canvas = document.getElementById('battle-canvas');

            if (pattern.isCrossArena) {
                wrapper.style.borderColor = 'transparent';
                wrapper.style.backgroundColor = 'transparent';
            } else {
                wrapper.style.borderColor = '#ffffff';
                wrapper.style.backgroundColor = '#000000';
            }

            wrapper.style.maxWidth = '';
            wrapper.style.width = pattern.boxW || '100%';
            wrapper.style.height = pattern.boxH || '220px';

            canvas.width = Math.max(200, wrapper.clientWidth - 10);
            canvas.height = Math.max(160, wrapper.clientHeight - 10);
            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;

            lastBattleFrameTime = performance.now();
            battleAnimId = requestAnimationFrame(battleLoop);
        }

        function spawnAimedBlaster(w, h, stepIndex, chargeTime = 42) {
            const px = player.x + player.size / 2;
            const py = player.y + player.size / 2;
            const side = stepIndex % 4;
            let ox = 0, oy = 0;

            if (side === 0) {
                ox = 35 + ((stepIndex * 79) % Math.max(60, w - 70));
                oy = -28;
            } else if (side === 1) {
                ox = w + 28;
                oy = 28 + ((stepIndex * 53) % Math.max(50, h - 56));
            } else if (side === 2) {
                ox = 35 + ((stepIndex * 97) % Math.max(60, w - 70));
                oy = h + 28;
            } else {
                ox = -28;
                oy = 28 + ((stepIndex * 61) % Math.max(50, h - 56));
            }

            const angle = Math.atan2(py - oy, px - ox);
            const promptChar = getNextAlphabetPrompt();
            blasters.push({
                originX: ox,
                originY: oy,
                beamAngle: angle,
                timer: 0,
                gatherDelay: 0,
                chargeTime: chargeTime,
                fireTime: 18,
                fired: false,
                scaleMult: 0.9,
                typingPrompt: promptChar,
                isMatched: false
            });
        }

        function spawnCircleBlastersCluster(w, h) {
            const cx = w / 2;
            const cy = h / 2;
            const radiusX = w * 0.48 + 38;
            const radiusY = h * 0.48 + 38;
            const count = 12;
            const totalGather = 44;
            const holdWait = 360;
            const fireStep = 8;
            const groupId = typingState.pairSeq++;

            const promptText = gameState.difficulty >= 4 ? getNextSentencePrompt() : getNextWordPrompt();
            typingState.sansBubblePrompt = promptText;
            typingState.sansBubbleGroupId = groupId;
            typingState.sansBubbleMatched = (typingState.currentInput.trim().toUpperCase() === promptText.toUpperCase());
            updateSansPromptBubble();

            for (let i = 0; i < count; i++) {
                const theta = (i / count) * Math.PI * 2;
                const ox = cx + Math.cos(theta) * radiusX;
                const oy = cy + Math.sin(theta) * radiusY;
                const aimAngle = Math.atan2(cy - oy, cx - ox);
                const delay = i * 4;

                blasters.push({
                    originX: ox,
                    originY: oy,
                    beamAngle: aimAngle,
                    timer: 0,
                    gatherDelay: delay,
                    chargeTime: (totalGather - delay) + holdWait + (i * fireStep),
                    fireTime: 22,
                    fired: false,
                    scaleMult: 0.92,
                    circleGroupId: groupId,
                    typingPrompt: null,
                    isMatched: false
                });
            }
        }

        function spawnSurroundingSawRingAndBlasters(w, h) {
            const cx = w / 2;
            const cy = h / 2;
            player.mode = 'RED';
            player.x = cx - player.size / 2;
            player.y = cy - player.size / 2;

            const sawCount = 16;
            const startR = Math.min(w, h) * 0.48;
            const midR = Math.min(w, h) * 0.34;
            const finalR = Math.min(w, h) * 0.23;
            const groupId = typingState.pairSeq++;

            const apocQueue = [
                getNextAlphabetPrompt(),
                getNextAlphabetPrompt(),
                getNextAlphabetPrompt(),
                getNextAlphabetPrompt(),
                getNextAlphabetPrompt(),
                getNextWordPrompt(),
                getNextWordPrompt(),
                getNextSentencePrompt()
            ];
            typingState.apocalypseQueue = apocQueue;
            typingState.apocalypseGroupId = groupId;
            typingState.sansBubblePrompt = apocQueue[0];
            typingState.sansBubbleGroupId = groupId;
            typingState.sansBubbleMatched = (typingState.currentInput.trim().toUpperCase() === apocQueue[0].toUpperCase());
            updateSansPromptBubble();

            surroundingSaws = [];
            for (let i = 0; i < sawCount; i++) {
                const theta = (i / sawCount) * Math.PI * 2;
                surroundingSaws.push({
                    theta: theta,
                    radius: 14,
                    currentDist: startR,
                    startDist: startR,
                    midDist: midR,
                    finalDist: finalR,
                    angle: 0,
                    rotSpeed: i % 2 === 0 ? 0.16 : -0.16,
                    timer: 0,
                    aimFrames: 360
                });
            }

            const totalBlasters = 30;
            const burstCount = 16;
            const streamCount = totalBlasters - burstCount;

            for (let i = 0; i < burstCount; i++) {
                const theta = (i / burstCount) * Math.PI * 2;
                const ox = cx + Math.cos(theta) * (w * 0.56 + 34);
                const oy = cy + Math.sin(theta) * (h * 0.56 + 34);
                const offsetAng = (i % 2 === 0 ? 1 : -1) * 0.14;
                const aimAngle = Math.atan2(cy - oy, cx - ox) + offsetAng;

                blasters.push({
                    originX: ox,
                    originY: oy,
                    beamAngle: aimAngle,
                    timer: 0,
                    gatherDelay: Math.floor(i * 1.5),
                    chargeTime: 540 - Math.floor(i * 1.5),
                    fireTime: 32,
                    fired: false,
                    scaleMult: 0.92,
                    circleGroupId: groupId
                });
            }

            for (let j = 0; j < streamCount; j++) {
                const theta = ((j + 0.5) / streamCount) * Math.PI * 2;
                const ox = cx + Math.cos(theta) * (w * 0.62 + 44);
                const oy = cy + Math.sin(theta) * (h * 0.62 + 44);
                const stagger = j * 14;

                blasters.push({
                    originX: ox,
                    originY: oy,
                    beamAngle: Math.atan2(cy - oy, cx - ox),
                    timer: 0,
                    gatherDelay: Math.min(90, j * 5),
                    chargeTime: 540 + stagger - Math.min(90, j * 5),
                    fireTime: 24,
                    fired: false,
                    trackPlayerUntilFire: true,
                    scaleMult: 0.85,
                    circleGroupId: groupId
                });
            }
        }

        function spawnSideTripleBlasters(w, h) {
            const cx = w / 2;
            const cy = h / 2;
            const yPositions = [h * 0.2, h * 0.5, h * 0.8];
            const useSideWord = gameState.difficulty >= 4;
            const leftWord = useSideWord ? getNextWordPrompt() : null;
            const rightWord = useSideWord ? getNextWordPrompt() : null;
            const leftGroupId = useSideWord ? typingState.pairSeq++ : undefined;
            const rightGroupId = useSideWord ? typingState.pairSeq++ : undefined;

            yPositions.forEach((oy, idx) => {
                const lx = -22;
                blasters.push({
                    originX: lx,
                    originY: oy,
                    beamAngle: Math.atan2(cy - oy, cx - lx),
                    timer: 0,
                    gatherDelay: 0,
                    chargeTime: useSideWord ? 360 : 300,
                    fireTime: 26,
                    fired: false,
                    scaleMult: 1.05,
                    typingPrompt: useSideWord ? leftWord : getNextAlphabetPrompt(),
                    isMatched: false,
                    sideGroupId: leftGroupId,
                    showPromptLabel: !useSideWord || idx === 1,
                    isWordPrompt: useSideWord
                });
                const rx = w + 22;
                blasters.push({
                    originX: rx,
                    originY: oy,
                    beamAngle: Math.atan2(cy - oy, cx - rx),
                    timer: 0,
                    gatherDelay: 0,
                    chargeTime: useSideWord ? 360 : 300,
                    fireTime: 26,
                    fired: false,
                    scaleMult: 1.05,
                    typingPrompt: useSideWord ? rightWord : getNextAlphabetPrompt(),
                    isMatched: false,
                    sideGroupId: rightGroupId,
                    showPromptLabel: !useSideWord || idx === 1,
                    isWordPrompt: useSideWord
                });
            });
        }

        function spawnMegaFullScreenBlaster(w, h) {
            const groupId = typingState.pairSeq++;
            const promptText = getNextSentencePrompt();
            typingState.sansBubblePrompt = promptText;
            typingState.sansBubbleGroupId = groupId;
            typingState.sansBubbleMatched = (typingState.currentInput.trim().toUpperCase() === promptText.toUpperCase());
            updateSansPromptBubble();

            blasters.push({
                originX: -48,
                originY: h / 2,
                beamAngle: 0,
                timer: 0,
                gatherDelay: 0,
                chargeTime: 420,
                fireTime: 55,
                fired: false,
                isMega: true,
                scaleMult: 6.2,
                circleGroupId: groupId,
                typingPrompt: null,
                isMatched: false
            });
        }

        function triggerWallSlam(dir) {
            player.mode = 'BLUE';
            const wordPrompt = getNextWordPrompt();
            slamState = {
                active: true,
                dir: dir,
                phase: 'SLAM',
                timer: 0,
                typingPrompt: wordPrompt,
                isMatched: (typingState.currentInput.trim().toUpperCase() === wordPrompt.toUpperCase()),
                negated: false
            };
            audio.playTone(220, 'square', 0.12, 0.08);
        }

        function spawnSawtoothBoneGear(w, h, idx, spd) {
            const isTop = idx % 2 === 0;
            const radius = 44;
            const promptChar = getNextAlphabetPrompt();
            projectiles.push({
                x: w + 55,
                y: isTop ? (radius + 12) : (h - radius - 12),
                vx: -3.4 * spd,
                vy: 0,
                radius: radius,
                angle: 0,
                rotSpeed: isTop ? 0.11 : -0.11,
                isSawtoothGear: true,
                typingPrompt: promptChar,
                isMatched: false
            });
        }

        function spawnGiantBoneSlam(w, h, idx) {
            const slamW = Math.floor(w * 0.42);
            const slamH = Math.floor(h * 0.64);
            const isTop = idx % 2 === 0;
            const sx = idx === 1 ? Math.floor((w - slamW) / 2) : (idx === 0 ? 18 : w - slamW - 18);
            const sy = isTop ? 0 : (h - slamH);
            const wordPrompt = getNextWordPrompt();
            slamWarnings.push({
                x: sx,
                y: sy,
                w: slamW,
                h: slamH,
                timer: 105,
                typingPrompt: wordPrompt,
                isMatched: (typingState.currentInput.trim().toUpperCase() === wordPrompt.toUpperCase()),
                isWordPrompt: true
            });
            audio.playTone(320, 'square', 0.1, 0.06);
        }

        function spawnBlasterBomb(w, h, idx) {
            const bx = w * 0.25 + ((idx * 173) % (w * 0.5));
            const by = h * 0.35 + ((idx * 67) % (h * 0.3));
            const wordPrompt = getNextWordPrompt();
            bombs.push({
                x: bx,
                y: -25,
                targetY: by,
                vy: 4.5,
                fuse: 180,
                spin: 0,
                typingPrompt: wordPrompt,
                isMatched: (typingState.currentInput.trim().toUpperCase() === wordPrompt.toUpperCase()),
                isWordPrompt: true
            });
        }

        function explodeBlasterBomb(bx, by) {
            audio.playBlasterFire();
            screenShake.timer = 14;
            shockwaves.push({ x: bx, y: by, r: 6, maxR: 85, life: 16, color: '#00ffff' });

            for (let i = 0; i < 6; i++) {
                const spreadAngle = (i / 6) * Math.PI * 2;
                const ox = bx + Math.cos(spreadAngle) * 58;
                const oy = by + Math.sin(spreadAngle) * 58;
                const aimToPlayer = Math.atan2((player.y + player.size / 2) - oy, (player.x + player.size / 2) - ox);
                const promptChar = getNextAlphabetPrompt();
                blasters.push({
                    originX: ox,
                    originY: oy,
                    beamAngle: aimToPlayer,
                    timer: 0,
                    gatherDelay: 0,
                    chargeTime: 240,
                    fireTime: 20,
                    fired: false,
                    scaleMult: 0.72,
                    typingPrompt: promptChar,
                    isMatched: false
                });
            }
        }

        function runSubPattern(subName, f, w, h, diff) {
            const spd = diff.speedMult;
            const isFast = gameState.difficulty >= 2;

            if (subName === 'P1_SIMPLE_BONES') {
                const interval = isFast ? 48 : 60;
                if (f % interval === 0) {
                    const step = Math.floor(f / interval);
                    const fromLeft = step % 2 === 0;
                    const gapH = isFast ? 62 : 72;
                    const gapY = 28 + ((step * 43) % Math.max(20, h - gapH - 56));
                    const promptChar = getNextAlphabetPrompt();
                    const pairId = typingState.pairSeq++;
                    projectiles.push({ x: fromLeft ? -14 : w + 14, y: 0, w: 12, h: gapY, vx: (fromLeft ? 1 : -1) * 2.4 * spd, vy: 0, type: 'WHITE', typingPrompt: promptChar, isMatched: false, pairId: pairId, showPromptLabel: true, labelY: gapY + gapH / 2 });
